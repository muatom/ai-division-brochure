    <div class="cblocks two big">${keys.map((k, i) => catBlock(k, .06 + i * .1)).join('')}</div>
    ${foot(d.n)}
  </div>`;
  };

  // ---------- the ladder ----------
  const lcard = (lv, pos, delay) => {
    const L = C.levels[lv];
    return `<button class="lcard lv${lv} on-l${lv}" data-go="${pageOf(`L${lv}-gate`)}" style="${pos};--d:${delay}s" data-rv aria-label="${L.k} ${esc(L.en)}: ${esc(L.he)} עמוד ${pageOf(`L${lv}-gate`)}">
      <span class="c"><span class="k"><b class="ltr">${L.k}</b><span class="ltr">${esc(L.en)}</span></span>
      <span class="d">${esc(L.he)}</span><span class="m">${count[lv]} פעילויות · עמ׳ ${pageOf(`L${lv}-gate`)}</span></span>
      ${W.hero(lv)}</button>`;
  };
  const base = () => { const B = C.ladder.base; return B ? `<div class="l0" ${rv(.08)}><b class="ltr">${esc(B.k)}</b><span class="t"><b>${esc(B.name)}.</b> ${md(B.text)}</span><span class="s">${esc(B.surf || '')}</span></div>` : ''; };
  M.base = base;
  T.ladder1 = (d) => `<div class="pc lad">
    ${head(esc(C.ladder.kicker))}
    <h2 ${rv(0)}>${md(C.ladder.title)}</h2>
    <p class="body" ${rv(.08)}>${md(C.ladder.body)}</p>
    <div class="surfnote" ${rv(.12)}><span class="gl">${LV.map(lv => W.glyph(lv)).join('')}</span><span>${md(C.ladder.surf)}</span></div>
    <div class="stairs with0">
      ${lcard(1, 'right:0;bottom:62px', .16)}
      ${lcard(2, 'left:0;bottom:238px', .28)}
      <div class="dash" style="left:70%;right:0;bottom:414px"></div>
      <div class="climb" ${rv(.36)}>${I.icon('arrowL', 20, 2)}${md(C.ladder.climb)}</div>
      ${base()}
    </div>
    ${foot(d.n)}
  </div>`;
  T.ladder2 = (d) => `<div class="pc lad">
    ${head(esc(C.ladder.kicker))}
    <h2 class="sr-only">${esc(C.ladder.kicker)}, רמות 3 ו-4</h2>
    <div class="stairs" style="margin-top:20px">
      <div class="dash" style="left:0;right:70%;bottom:176px"></div>
      ${lcard(3, 'right:0;bottom:352px', .4)}
      ${lcard(4, 'left:0;bottom:528px', .52)}
      <div class="guide" ${rv(.1)}><h4>${md(C.ladder.guideTitle)}</h4><p>${md(C.ladder.guide)}</p></div>
    </div>
    ${foot(d.n)}
  </div>`;

  // the level opener spans two facing pages. The wave is one drawing placed on both pages, so it crosses the fold
  // when the issue lies open; on a phone or in one-page view each page shows its half of it.
  T.gate = (d) => {
    const lv = d.lv, L = C.levels[lv], G = C.gateLabels, dark = lv > 1, first = d.part === 1;
    const wave = `<div class="wclip" aria-hidden="true"><div class="bigwave ${first ? 'onR' : 'onL'}">${W.hero(lv)}</div></div>`;
    if (first) return `<div class="pc gate lv${lv} on-l${lv}">${lv === 4 ? '<div class="glow"></div>' : ''}${wave}
    <h2 class="sr-only">${esc(L.chapter)}: ${L.k} ${esc(L.en)}</h2>
    <div class="top"><span class="chap">${esc(L.chapter)}</span>${lock(dark ? 'md inv' : 'md dk')}</div>
    <div class="gh" ${rv(0)}><div class="rule"></div><div class="L">${L.k}</div>
      <div class="en" lang="en">${esc(L.en)}</div><p class="tag">${md(L.he)}</p>
      <div class="cnt"><span class="n ltr" data-count="${count[lv]}">${count[lv]}</span><span class="l">פעילויות</span></div>
      ${levelCats(lv)}</div>
  </div>`;
    return `<div class="pc gate gb lv${lv} on-l${lv}">${lv === 4 ? '<div class="glow"></div>' : ''}${wave}
    <div class="top">${ldr(lv, 'hi' + (dark ? ' inv' : ''))}<span class="ltr pgn">${d.n}</span></div>
    <dl ${rv(.1)}>
      <div><dt>${esc(G.what)}</dt><dd>${md(L.what)}</dd></div>
      <div><dt>${esc(G.fit)}</dt><dd>${md(L.fit)}</dd></div>
      <div><dt>${esc(G.who)}</dt><dd>${md(L.who)}</dd></div>
    </dl>
    <div class="surf" ${rv(.18)}>${W.glyph(lv)}<span>${md(L.surf, 'b')}</span></div>
  </div>`;
  };

  // the first spotlight of a level spans two facing pages: the text on the right, the picture or video on a full page on the left
  T.feat = (d) => {
    const lv = d.lv, it = byId(d.id);
    if (d.part === 1) return `<div class="pc hero ft lv${lv}">
    ${head(`${lvName(lv)}<span>· ${esc(C.tiers[1])}</span>`, lv)}
    <div class="fb">
      <div class="meta" ${rv(0)}>${meta(it, lv)}</div>
      <h2 ${rv(.08)}>${nameH(it)}<span class="tt">${md(it.h1)}</span></h2>
      <p class="line" ${rv(.14)}>${terms(it.line || it.what)}</p>
      <div class="src" ${rv(.18)}><span>עבור: ${who(it, true)}</span>${xp(it)}</div>
      <div ${rv(.24)}>${valRow(it)}</div>
      ${it.takeaway ? `<div class="take" ${rv(.3)}>${md(it.takeaway, 'b')}</div>` : ''}
      ${byline(it)}
    </div>
    ${foot(d.n)}
  </div>`;
    return `<div class="pc fm lv${lv}">
    <div class="mm" ${rv(.06)}>${media(it, lv)}</div>
    <div class="mcap" ${rv(.14)}><b>${esc(it.name || it.title)}</b><span class="ltr">${d.n}</span></div>
  </div>`;
  };

  // ---------- spotlight (pri 1): the value, the media box ----------
  // the value as one clean row: a number, a before and after, or a sentence
  function valRow(it, cls) {
    const P = it.pull || {};
    let big;
    if (P.stat) big = `<span class="stat ltr"${P.count ? ` data-count="${P.count}" data-suffix="${esc(String(P.stat).replace(/^[\d.]+/, ''))}"` : ''}>${esc(P.stat)}</span> ${esc(P.statNote)}`;
    else if (P.big) big = md(P.big, 'grow');
    else if (P.from) big = `<span>${esc(P.from)}</span>${I.icon('arrowL', 26, 2.5)}<span class="to">${esc(P.to)}</span>`;
    else if (it.value) big = terms(it.value);
    else return '';
    const note = P.stat ? (P.also ? `ועוד: ${esc(P.also)}` : '') : esc(P.note || '');
    return `<div class="vrow${cls ? ' ' + cls : ''}"><div class="lab">${valLab(it)}</div><div class="vb${P.from && !P.stat && !P.big ? ' ft' : ''}">${big}</div>${note ? `<div class="note">${note}</div>` : ''}</div>`;
  }
  // a PowerPoint window drawn in code: a slide in Migdal's look (logo, kicker, navy title, a chart and text lines),
  // with the slide thumbnails on the right. An illustration of the output, not a screenshot, so no real numbers in it
  const deckMock = m => {
    const bars = [38, 52, 46, 64, 58, 78], th = k => `<i class="pp-th${k === 0 ? ' on' : ''}"><b></b><s></s><s></s>${k === 1 ? '<u></u>' : ''}</i>`;
    return `<div class="pp" role="img" aria-label="${esc(m.alt || 'מצגת בשפת המותג של מגדל')}">
      <div class="pp-top"><span class="pp-dots"><i></i><i></i><i></i></span><span class="pp-file">${(f => { const i = f.lastIndexOf('.'); return i > 0 ? `${esc(f.slice(0, i))}<span dir="ltr">${esc(f.slice(i))}</span>` : esc(f); })(m.file || 'מצגת.pptx')}</span><span class="pp-tabs"><i></i><i></i><i></i></span></div>
      <div class="pp-body">
        <div class="pp-rail">${[0, 1, 2, 3].map(th).join('')}</div>
        <div class="pp-stage"><div class="pp-slide">
          <div class="pp-h">${lock('pp-lock')}<span class="pp-kick"><i></i>${esc(m.kicker || 'תחום Data & AI')}</span></div>
          <div class="pp-t">${esc(m.title || 'ועדת היגוי')}<em>${esc(m.sub || 'תמונת מצב')}</em></div>
          <div class="pp-c"><div class="pp-chart">${bars.map((h, i) => `<i style="height:${h}%"${i === bars.length - 1 ? ' class="hi"' : ''}></i>`).join('')}</div>
            <div class="pp-txt"><b></b><s></s><s></s><s class="sh"></s><span class="pp-chip"></span></div></div>
          <div class="pp-f"><span></span><span class="ltr">04</span></div>
        </div></div>
      </div></div>`;
  };
  // MATCH-UP as a drawn flow: two sources, the engine, a person who approves, and the money landing in the right fund.
  // On a slide it runs right to left; on the full page of a spread it runs top to bottom. The words come from the content
  const coin = cls => `<i class="mf-coin${cls ? ' ' + cls : ''}" aria-hidden="true">₪</i>`;
  const arrow = (cls, lab, c) => `<div class="mf-ar ${cls}"><span class="ln"></span>${c ? coin() : ''}${lab ? `<b>${esc(lab)}</b>` : ''}${I.icon('arrowL', 14, 2.4)}</div>`;
  // the fund: a box with a slot, and a coin dropping into it
  const fundArt = () => `<svg class="mf-fund" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="13" r="9" class="c"/><text x="32" y="17.2" text-anchor="middle" class="t">₪</text><path d="M24 26h16" class="sl"/><rect x="10" y="30" width="44" height="26" rx="6" class="bx"/><path d="M18 40h28M18 47h18" class="ln"/></svg>`;
  const matchFlow = m => {
    const [s1, s2] = m.sources;
    return `<div class="mf" role="img" aria-label="${esc(m.alt || '')}">
      <div class="mf-src">
        <div class="mf-c src"><div class="mf-h"><span class="n ltr">01</span>${I.icon('bank', 15, 1.8)}<b>${esc(s1[0])}</b></div>
          <div class="mf-bank"><i></i><i class="hi"></i><i></i></div><p>${esc(s1[1])}</p></div>
        <div class="mf-c src"><div class="mf-h"><span class="n ltr">02</span>${I.icon('mail', 15, 1.8)}<b>${esc(s2[0])}</b></div>
          <div class="mf-att"><span>צרופה</span><span>צרופה</span></div><p>${esc(s2[1])}</p></div>
      </div>
      ${arrow('a1')}
      <div class="mf-c eng"><div class="mf-h"><span class="n ltr">03</span><b class="ltr">${esc(m.engine[0])}</b><span class="ai">AI</span></div>
        <p>${esc(m.engine[1])}</p>
        <div class="mf-keys"><span class="l">מפתחות הצלבה</span>${m.keys.map(k => `<span class="k">${esc(k)}</span>`).join('')}</div>
        <div class="mf-db">${I.icon('db', 14, 1.9)}${esc(m.db || 'מאגר העמיתים')}</div></div>
      ${arrow('a2', m.proposed || 'שיוך מוצע')}
      <div class="mf-c chk"><div class="mf-h"><span class="n ltr">04</span>${I.icon('user', 15, 1.9)}<b>${esc(m.check[0])}</b></div><p>${esc(m.check[1])}</p><span class="mf-doubt">${esc(m.doubt)}</span></div>
      ${arrow('a3', m.approved || 'שיוך מאושר', true)}
      <div class="mf-c end">${fundArt()}<div class="mf-h"><span class="n ltr">05</span><b>${esc(m.end[0])}</b><span class="ok">${I.icon('check', 13, 2.6)}</span></div><p>${esc(m.end[1])}</p></div>
    </div>`;
  };
  // the agent at work: a short chat in which the agent asks what it needs before it builds the deck.
  // m.chat: [['u' or 'a', text, attachment?], ...]; the last line of the agent is the finished deck
  const agentChat = m => {
    const last = m.chat.length - 1;
    return `<div class="ag" aria-hidden="true">
      <div class="ag-h"><span class="ag-av">${I.icon('spark', 15, 1.9)}</span><span class="ag-n"><b>${esc(m.agent || 'סוכן המצגות')}</b><span>${esc(m.agentSub || 'מכיר את ספר המותג ואת התבניות')}</span></span></div>
      <div class="ag-b">${m.chat.map(([w, t, f], k) => `<div class="ag-m ${w === 'u' ? 'u' : 'a'}${k === last && w !== 'u' ? ' done' : ''}">${esc(t)}${f ? `<span class="ag-f">${I.icon('clip', 12, 2)}${esc(f)}</span>` : ''}${k === last && w !== 'u' ? '<span class="ag-p"><i></i><i></i><i></i><i></i></span>' : ''}</div>`).join('')}</div>
      <div class="ag-in"><span>${esc(m.placeholder || 'מה צריך במצגת?')}</span><i>${I.icon('send', 12, 2.4)}</i></div>
    </div>`;
  };
  // "להרחבה": opens the activity card, with the full story when the activity has one (more)
  const xp = (it, cls) => `<button class="xp${cls ? ' ' + cls : ''}" data-item="${it.id}" aria-label="${esc(it.name || it.title)}: להרחבה">להרחבה${I.icon('chevL', 13, 2.2)}</button>`;
  M.xp = xp;
  // the media box: a photo or a video once there is one, the illustration until then.
  // src may name an item of the media block ([C]) with a hash: '#migdalor-home'
  const msrc = s => (typeof s === 'string' && s[0] === '#') ? ((window.MEDIA || {})[s.slice(1)] || '') : s;
  function media(it, lv) {
    const m = it.media, art = window.ART ? window.ART.art(it, lv) : '';
    // phone screenshots: up to three phones rising from the bottom of the box, the middle one larger and higher
    if (m && m.type === 'phones' && m.src && m.src.length) {
      const alt = [].concat(m.alt || []);
      // in a right-to-left row the first phone sits on the right; with three, the middle one is the hero
      const hero = m.src.length === 3 ? 1 : -1;
      return `<div class="media has phones n${m.src.length}">${m.src.map((s, k) => `<div class="ph${k === hero ? ' hero' : ''}"><img src="${esc(msrc(s))}" alt="${esc(alt[k] || it.title)}" loading="lazy"></div>`).join('')}</div>`;
    }
    // a screenshot of a web tool, in a quiet browser window: three dots, an address pill, and the screen top-aligned
    // host: 'crm' puts the screenshot as a side panel inside a CRM drawn as a quiet skeleton, with no customer data
    const crm = s => `<div class="crm"><div class="crm-sk" aria-hidden="true"><b></b><div class="st"><i></i><i class="on"></i><i></i></div><div class="tb"><s class="on"></s><s></s><s></s></div>${[0, 1, 2, 3, 4, 5].map(() => '<div class="f"><s></s><s></s></div>').join('')}</div>
      <div class="crm-bot">${s}<div class="crm-in"><span>${esc(m.ask || 'הקלד/י את שאלתך כאן...')}</span><i>${I.icon('send', 11, 2.4)}</i></div></div></div>`;
    if (m && m.type === 'screen' && m.src) {
      const img = `<img src="${esc(msrc(m.src))}" alt="${esc(m.alt || it.title)}" loading="lazy">`;
      return `<div class="media has mock scr${m.host ? ' host' : ''}"><div class="bw"><div class="bw-top"><span class="pp-dots"><i></i><i></i><i></i></span><span class="bw-url">${esc(m.url || it.name || it.title)}</span></div>${m.host === 'crm' ? crm(img) : img}</div></div>`;
    }
    if (m && m.type === 'match') return `<div class="media has mock mfl">${matchFlow(m)}</div>`;
    if (m && m.type === 'deck') return m.chat ? `<div class="media has mock cdk"><div class="cd">${agentChat(m)}${deckMock(m)}</div></div>` : `<div class="media has mock">${deckMock(m)}</div>`;
    if (m && m.src) {
      const fit = m.fit === 'contain' ? ' contain' : '';
      const el = m.type === 'video'
        ? `<video src="${esc(msrc(m.src))}"${m.poster ? ` poster="${esc(msrc(m.poster))}"` : ''} muted loop playsinline preload="metadata" aria-label="${esc(m.alt || it.title)}"></video>`
        : `<img src="${esc(msrc(m.src))}" alt="${esc(m.alt || it.title)}" loading="lazy">`;
      return `<div class="media has${fit}">${el}</div>`;
    }
    const tag = C.meta.placeholders ? `<span class="mtag">${I.icon('image', 13, 1.8)}מקום לתמונה או לסרטון</span>` : '';
    return `<div class="media">${art}${tag}</div>`;
  }
  // the heading of a featured activity: the name, then what it does in plain words
  // mark: a product name set as a wordmark, the last word small and raised (המגדלור AI, like the app's logo)
  const wordmark = it => { const p = String(it.name).split(' '), sup = p.pop(); return `<span class="wm">${esc(p.join(' '))}<sup lang="en">${esc(sup)}</sup></span>`; };
  const nameH = (it, sz) => `<span class="nm"><span class="ico" aria-hidden="true">${I.icon(C.cats[it.cat] ? C.cats[it.cat].icon : 'agent', sz || 18, 1.7)}</span><span>${it.mark ? wordmark(it) : terms(it.name || it.title)}</span></span>`;
  const meta = (it, lv) => `<span class="lv"><i class="sw" style="background:${LVC[lv]}"></i>${ltr(C.levels[lv].k)}</span>${status(it.status)}${ctag(it.cat)}`;
  M.hero = { valRow, media, nameH, meta, valLab };

  T.p1 = (d) => {
    const lv = d.lv, it = byId(d.id);
    return `<div class="pc hero p1 lv${lv}">
    ${head(`${lvName(lv)}<span>· ${esc(C.tiers[1])}${d.of > 1 ? ` ${d.i + 1} מתוך ${d.of}` : ''}</span>`, lv)}
    <div class="meta" ${rv(0)}>${meta(it, lv)}</div>
    <h2 ${rv(.08)}>${nameH(it)}<span class="tt">${md(it.h1)}</span></h2>
    <p class="line" ${rv(.14)}>${terms(it.line || it.what)}</p>
    <div class="src" ${rv(.18)}><span>עבור: ${who(it, true)}</span>${xp(it)}</div>
    <div ${rv(.22)} class="mwrap">${media(it, lv)}</div>
    <div ${rv(.3)}>${valRow(it)}</div>
    ${it.takeaway ? `<div class="take" ${rv(.36)}>${md(it.takeaway, 'b')}</div>` : ''}
    ${byline(it)}
    ${foot(d.n)}
  </div>`;
  };

  // ---------- in focus (pri 2): two activities on a page, as a diptych ----------
  // one band holds both pictures, and below it two text columns with a rule between them. On a phone the band
  // gives way to a picture above each column, so every picture stays next to its own text.
  const sTags = it => `<div class="s-k">${status(it.status)}${ctag(it.cat)}</div>`;
  const sName = (it, n) => `<button class="s-n" data-item="${it.id}" aria-label="${esc(it.title)}: הכרטיס המלא"><b class="ltr">${n}</b><span>${esc(it.name || it.title)}</span></button>`;
  const sFoot = it => `<div class="s-f">עבור: ${who(it)}${it.pm ? ` · מנהל/ת מוצר: ${esc(it.pm)}` : ''}</div>`;
  const sArt = (it, lv, cls) => `<div class="s-a${cls ? ' ' + cls : ''}">${window.ART ? window.ART.mini(it, lv) : ''}</div>`;
  const sText = (it, n) => `<div class="s-x">${sName(it, n)}<h3 class="s-h">${md(it.h1)}</h3><p class="s-l">${terms(it.what)} ${xp(it, 'tx')}</p>${valRow(it, 'sm')}${sTags(it)}${sFoot(it)}</div>`;
  const num = k => String(k + 1).padStart(2, '0');
  M.focus = { sText, sArt, num };
  T.p2 = (d) => {
    const lv = d.lv, its = d.ids.map(byId);
    return `<div class="pc p2 lv${lv}">
    ${head(`${lvName(lv)}<span>· ${esc(C.tiers[2])}</span>`, lv)}
    <h2 class="sr-only">${esc(C.tiers[2])}: ${its.map(x => esc(x.title)).join(', ')}</h2>
    <div class="band" ${rv(.04)}>${its.map(it => sArt(it, lv)).join('<i aria-hidden="true"></i>')}</div>
    <div class="cols">${its.map((it, k) => `<article class="sc" ${rv(.12 + k * .1)}>${sArt(it, lv, 'mob')}${sText(it, num(k))}</article>`).join('<div class="vr" aria-hidden="true"></div>')}</div>
    ${foot(d.n)}
  </div>`;
  };

  // ---------- in brief (pri 3): rows ----------
  T.list = (d) => {
    const lv = d.lv, list = tier(lv, 3), total = list.length;
    const rows = list.slice(d.from, d.to).map((it, j) => {
      const idx = d.from + j, id = it.id;
      return `<button class="row" data-item="${id}" aria-labelledby="${id}-t" aria-describedby="${id}-u" ${rv(.06 + j * .07)}>
        <span class="n">${String(idx + 1).padStart(2, '0')}</span>
        <span class="ico" aria-hidden="true">${I.icon(C.cats[it.cat] ? C.cats[it.cat].icon : 'agent', d.to - d.from <= 3 ? 24 : 20)}</span>
        <span class="tx"><span class="t" id="${id}-t">${esc(it.title)}</span>
          <span class="mt"><span id="${id}-u">${who(it)}</span><span class="dot">·</span>${status(it.status)}${ctag(it.cat)}${it.pm ? `<span class="dot">·</span><span>מנהל/ת מוצר: ${esc(it.pm)}</span>` : ''}</span>
          <span class="w">${terms(it.what)}</span>
          ${it.value ? `<span class="v"><b>${valLab(it)} · </b>${terms(it.value)}</span>` : ''}</span>
        <span class="go" aria-hidden="true">${I.icon('chevL', 15, 2)}</span></button>`;
    }).join('');
    const range = d.parts > 1 ? `${d.from + 1} עד ${d.to} מתוך ${total}` : `${total} פעילויות`;
    return `<div class="pc list lv${lv}${d.to - d.from <= 3 ? ' wide' : ''}">
    ${head(`${lvName(lv)}<span>· ${esc(C.tiers[3])}</span>`, lv)}
    <div class="ttl" ${rv(0)}><h2>בקצרה · עוד ברמה ${lv}</h2><span>${range}</span></div>
    <div class="rows">${rows}</div>
    ${foot(d.n)}
  </div>`;
  };

  // ---------- the next issue ----------
  const sigal = (cls) => {
    const A = C.teaser.agent;
    return `<div class="agent${cls ? ' ' + cls : ''}">
      <div class="ah"><span class="av" aria-hidden="true">${esc(A.name.slice(0, 1))}</span><div><div class="an">${esc(A.name)}</div><div class="ar">${esc(A.role)}</div></div></div>

    <div class="bot"><span>${esc(C.meta.orgFull)}</span><span>${esc(C.meta.title)} · ${esc(C.meta.issue)}</span></div>
  </div>`;

  function barColor(d) { return d.lv ? LVC[d.lv] : '#3c65e3'; }
  const DARK = d => d.kind === 'cover' || d.kind === 'back' || d.kind === 'teaser' || ((d.kind === 'gate' || (d.kind === 'feat' && d.part === 2)) && d.lv === 4);
  // full page = content + gutter + edge click zones + turn shading
  M.page = function (d) {
    const inner = T[d.kind](d);
    const pb = (d.kind === 'cover' || d.kind === 'back' || d.kind === 'gate' || d.kind === 'teaser' || (d.kind === 'feat' && d.part === 2)) ? '' : pbar(d.n, barColor(d));

  };

})(window.MAG);

<script id="slides">
/* =====================================================================
   [4] שקפי המצגת · PRESENTATION SLIDES (1600x900)
   ---------------------------------------------------------------------
   אותו תוכן כמו הניוזלטר, בעריכה להצגה על מסך: כותרת גדולה, שורה אחת, ויזואל אחד.
   מבנה: שער · אמירה · מספרים · תחומים · קטגוריות · הסולם · ולכל רמה: שער, שקף לכל פעילות בזרקור,
   שקף לכל זוג בפוקוס (אותו דיפטיך כמו בניוזלטר), ושקפי "בקצרה" של עד חמש · בגיליון הבא · סיום.
   הכפולות של הניוזלטר (שער הרמה והזרקור הראשון) הן שקף אחד כל אחת.
   ===================================================================== */
(function (M) {
  const C = window.CONTENT, I = window.ICONS, W = window.WAVES;
  const { TOK, count, catCount, CATS, md, esc, ltr, LVC, LVFG, tier, pairs, byId } = M.model;
  const { lock, status, lvName, rv, ctag, who, valLab, byline } = M.parts;
  const LV = [1, 2, 3, 4];

  // "in brief" tiles: at most five on a slide, so they read from the back of the room
  const tileSplit = n => { if (!n) return []; const p = Math.ceil(n / 5), out = []; let left = n; for (let i = 0; i < p; i++) { const s = Math.ceil(left / (p - i)); out.push(s); left -= s; } return out; };

  M.slidePlan = function () {
    const P = [];
    P.push({ kind: 'cover', key: 'cover', thumb: 'שער', tone: 'dark' });
    P.push({ kind: 'statement', key: 'editorial', thumb: 'דבר העורך' });
    P.push({ kind: 'numbers', key: 'numbers', thumb: 'המספרים' });
    P.push({ kind: 'areas', key: 'areas', thumb: 'למי אנחנו עובדים' });
    P.push({ kind: 'ladder', key: 'ladder', thumb: 'הסולם' });
    P.push({ kind: 'cats', key: 'cats', thumb: 'הקטגוריות' });
    LV.forEach(lv => {
      P.push({ kind: 'gate', lv, key: `L${lv}-gate`, thumb: `L${lv} · פתיח`, tone: lv });

    });
    P.push({ kind: 'teaser', key: 'teaser', thumb: 'בגיליון הבא', tone: 'dark' });

      <div class="labs">${LV.map(lv => `<div style="flex:${count[lv]}">${W.glyph(lv)}<b class="ltr">${C.levels[lv].k}</b><span class="ltr">${esc(C.levels[lv].en)}</span></div>`).join('')}</div>

  S.cats = (d, n, NS) => `<div class="slc s-cats">

    <div class="cgrid">${CATS.map((k, i) => {

  S.ladder = (d, n, NS) => `<div class="slc s-ladder">

    <div class="hd" ${rv(0)}><h2>${md(C.ladder.title.replace('\n', ' '))}</h2><p>${md(C.ladder.surf)}</p></div>
    <div class="steps">${LV.map((lv, i) => {
      const L = C.levels[lv];
      return `<button class="step lv${lv} on-l${lv}" data-slide-key="L${lv}-gate" style="margin-top:${(3 - i) * 72}px;--d:${.12 + i * .1}s" data-rv aria-label="${L.k} ${esc(L.en)}">

  // the level opener: the same big wave as on the two-page opener in the newsletter, here across one wide slide
  S.gate = (d, n, NS) => {
    const lv = d.lv, L = C.levels[lv], G = C.gateLabels, dark = lv > 1;

    <div class="cols">
      <div class="r" ${rv(0)}>
        <div class="rule"></div><div class="L">${L.k}</div>
        <div class="en" lang="en">${esc(L.en)}</div>
        <p class="tag">${md(L.he)}</p>

        </dl>

    <div class="hd" ${rv(0)}><h2>בקצרה · עוד ברמה ${lv}</h2><span class="c">${range} · ${esc(L.short)}</span><span class="g">${W.glyph(lv)}</span></div>

        <span class="tt"><span class="ico" aria-hidden="true">${I.icon(C.cats[it.cat] ? C.cats[it.cat].icon : 'agent', 24)}</span><span class="tts">${status(it.status)}${ctag(it.cat)}</span></span>
        <span class="t">${esc(it.title)}</span><span class="u">${who(it)}</span>

  M.slide = function (d, n, NS) {
    return `<section class="sl" data-n="${n}" data-key="${d.key}" aria-label="שקף ${n} מתוך ${NS}: ${esc(d.thumb)}">${S[d.kind](d, n, NS)}</section>`;
  };
})(window.MAG);
</script>
<script id="engine">
/* =====================================================================
   [5] מנוע · ENGINE
   ---------------------------------------------------------------------
   שני מצבים: ניוזלטר (עמודים) ומצגת (שקפים 16:9).
   בניוזלטר ארבע פריסות, לפי גודל המסך:
     spread  כפולת עמודים עם דפדוף תלת-ממדי (מסך רחב)
     single  עמוד אחד בכל פעם (מסך צר או נמוך)
     reader  גלילה אנכית בגודל טבעי (חלון קטן / זום גבוה)
     mobile  טלפון (רוחב מתחת ל-640): עמוד אחד על כל המסך, מחליקים הצידה. מצגת לא מוצעת בטלפון
   ניווט: חצים במקלדת (שמאל = הבא), PageUp/PageDown, רווח, Home/End, החלקה, לחיצה על שולי העמוד.
   קישור ישיר: #p12 לעמוד 12 · #s5 לשקף 5.  ?qa לבדיקת איכות.  ?still בלי אנימציות.  ?view=spread|single|reader|mobile
   ===================================================================== */
(function () {
  const M = window.MAG, C = window.CONTENT, I = window.ICONS, W = window.WAVES;
  const { PLAN, N, ALL, TOK, pageOf, esc, fill, LVC } = M.model;
  const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const app = $('#app'), view = $('#view'), book = $('#book'), stage = $('#stage');
  const Q = new URLSearchParams(location.search);
  const STILL = Q.has('still');
  const RMQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const RM = () => RMQ.matches || STILL;
  const phone = () => window.innerWidth < 640;
  if (STILL) app.classList.add('still');
  const SLIDES = M.slidePlan ? M.slidePlan() : [];
  const NS = SLIDES.length;
  const S = { mode: 'news', lay: null, built: '', page: 1, slide: 1, flip: null, queued: 0, card: null, panel: null, back: null, els: [] };

  const chromeEl = el => !!(el && el.closest && el.closest('#bar,.navbtn')), inChrome = () => chromeEl(document.activeElement);
  function idle() { app.classList.remove('idle'); clearTimeout(S.it); if (S.mode === 'deck' && !S.panel && !S.card) S.it = setTimeout(() => { if (S.mode === 'deck' && !inChrome()) app.classList.add('idle'); }, 2600); }
  document.addEventListener('focusout', e => { if (S.mode === 'deck' && chromeEl(e.target) && !chromeEl(e.relatedTarget)) idle(); }); // focus left the chrome: the pause starts again
  document.addEventListener('mousemove', () => { if (S.mode === 'deck') idle(); }, { passive: true });
  // touch and keyboard users must be able to bring the hidden deck chrome back too
  document.addEventListener('touchstart', () => { if (S.mode === 'deck') idle(); }, { passive: true });
  document.addEventListener('keydown', e => { if (S.mode === 'deck' && (e.key === 'Tab' || e.key === 'Escape')) idle(); });
  // a tap that brings back the hidden deck chrome only shows it; it does not also turn the slide
  document.addEventListener('pointerdown', e => { S.tapRev = S.mode === 'deck' && e.pointerType !== 'mouse' && app.classList.contains('idle'); }, true);
  // presenter's black screen (B or .); any key or click brings the slide back
  function black(on) {
    on = !!on && S.mode === 'deck'; if (on === !!S.black) return;
    S.black = on; app.classList.toggle('black', on);
    if (on) { clearTimeout(S.it); app.classList.add('idle'); announce('מסך שחור'); } else idle();
  }

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    if (S.black) { e.preventDefault(); black(false); return; }
    const t = e.target.closest('[data-nav],[data-go],[data-slide],[data-slide-key],[data-item],[data-panel],[data-mode],[data-fs],[data-close],[data-cstep],[data-flv],[data-fst],[data-fcat],[data-print]');
    if (!t) {
      if (e.target === scrim) closePanel(); else if (e.target === card) closeCard();
      else if (S.mode === 'deck' && !S.tapRev && !S.card && !S.panel && e.target.closest('.sl') && !e.target.closest('button,a,input')) step(1); // click on a slide = next
      S.tapRev = false; return;
    }
    const d = t.dataset;
    // a mouse click leaves no focus on the page-turn and mode buttons, so a presenter's Space still turns the page
    if (e.detail && t.tagName === 'BUTTON' && (d.nav || d.mode || d.fs != null)) t.blur();
    if (d.nav) step(d.nav === 'next' ? 1 : -1);
    else if (d.go) {
      const p = +d.go; closeCard(true); closePanel(true);
      if (S.mode === 'deck') { const i = slideOfKey((PLAN[p - 1] || {}).key || ''); if (i) goSlide(i, i > S.slide ? 1 : -1); }
      else goTo(p);
      focusCur();
    }
    else if (d.slide) { const n = +d.slide; closePanel(true); goSlide(n, n > S.slide ? 1 : -1); focusCur(); }
    else if (d.slideKey) { const i = SLIDES.findIndex(x => x.key === d.slideKey); if (i >= 0) goSlide(i + 1, i + 1 > S.slide ? 1 : -1); focusCur(); }
    else if (d.item) {
      const it = ALL.find(x => x.id === d.item);
      // from the search: land focus on the page first, so closing the card returns there
      if (d.from === 'finder' && it) { closePanel(true); if (S.mode === 'news') { goTo(it.page); focusCur(); } if (it.pri !== 1) setTimeout(() => openCard(it.id, null), S.lay && S.lay.kind === 'reader' ? 450 : 80); }
      else openCard(d.item, t);
    }
    else if (d.panel) openPanel(d.panel, t);
    else if (d.mode) setMode(d.mode);
    else if (d.fs != null) toggleFs();
    else if (d.close != null) { if (S.card) closeCard(); else closePanel(); }
    else if (d.cstep) stepCard(+d.cstep);
    else if (d.flv) { const v = +d.flv; F.lv.has(v) ? F.lv.delete(v) : F.lv.add(v); t.setAttribute('aria-pressed', String(F.lv.has(v))); listFinder(); }
    else if (d.fst) { const v = d.fst; F.st.has(v) ? F.st.delete(v) : F.st.add(v); t.setAttribute('aria-pressed', String(F.st.has(v))); listFinder(); }
    else if (d.fcat) { const v = d.fcat; F.cat.has(v) ? F.cat.delete(v) : F.cat.add(v); t.setAttribute('aria-pressed', String(F.cat.has(v))); listFinder(); }
    else if (d.print != null) { closePanel(true); setTimeout(() => window.print(), 50); }
  });
  document.addEventListener('keydown', e => {
    const tag = (e.target && e.target.tagName) || '';
    if (S.black) { if (!/^(Shift|Control|Alt|Meta)$/.test(e.key)) { e.preventDefault(); black(false); } return; }
    if (e.key === 'Tab') { if (S.card) trapFocus(e, card); else if (S.panel) trapFocus(e, panels[S.panel]); return; }
    if (e.key === 'Escape') {
      if (S.panel === 'finder' && tag === 'INPUT' && e.target.value) { e.preventDefault(); e.target.value = F.q = ''; listFinder(); return; } // first Esc clears the search, the second closes
      if (S.card) closeCard(); else if (S.panel) closePanel(); else if (S.mode === 'deck') setMode('news'); return;
    }
    if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
    // Space or Enter on a focused control presses it; it never turns the page
    if ((e.key === ' ' || e.key === 'Enter') && e.target.closest && e.target.closest('button,a,[role=button],input')) return;
    if (S.card) { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); stepCard(e.key === 'ArrowLeft' ? 1 : -1); } return; }
    if (S.panel) return;
    if (e.key === '/' && S.mode === 'news') { e.preventDefault(); openPanel('finder'); return; }
    const k = e.key;
    // phone pager: ArrowUp/ArrowDown scroll a tall page even when focus sits on the page itself or nowhere
    if (isPager() && (k === 'ArrowDown' || k === 'ArrowUp')) { const s = (S.els[S.page - 1] || {})._sh; if (s && !s.contains(e.target)) { e.preventDefault(); s.scrollTop += k === 'ArrowDown' ? 64 : -64; } return; }
    // presentation clickers: ArrowDown or N next, ArrowUp or P back, B or . black screen (by key position too, for a Hebrew layout)
    if (S.mode === 'deck' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      if (e.code === 'KeyB' || e.code === 'Period' || k === 'b' || k === 'B' || k === '.') { e.preventDefault(); black(true); return; }
      if (k === 'ArrowDown' || e.code === 'KeyN') { e.preventDefault(); step(1); return; }
      if (k === 'ArrowUp' || e.code === 'KeyP') { e.preventDefault(); step(-1); return; }
    }
    if (k === 'ArrowLeft' || k === 'PageDown' || (k === ' ' && !e.shiftKey)) { if (S.lay.kind === 'reader' && S.mode === 'news' && (k === ' ' || k === 'PageDown')) return; e.preventDefault(); step(1); }
    else if (k === 'ArrowRight' || k === 'PageUp' || (k === ' ' && e.shiftKey)) { if (S.lay.kind === 'reader' && S.mode === 'news' && k !== 'ArrowRight') return; e.preventDefault(); step(-1); }
    else if (k === 'Home') { e.preventDefault(); S.mode === 'deck' ? goSlide(1, -1) : goTo(1); }
    else if (k === 'End') { e.preventDefault(); S.mode === 'deck' ? goSlide(NS, 1) : goTo(N); }
  });
  let touch = null;
  view.addEventListener('touchstart', e => { const t = e.touches[0]; touch = t ? { x: t.clientX, y: t.clientY } : null; }, { passive: true });
  view.addEventListener('touchend', e => {
    const t0 = touch, t = e.changedTouches[0]; touch = null;
    if (!t0 || !t || (S.mode === 'news' && (S.lay.kind === 'reader' || S.lay.kind === 'mobile'))) return; // the phone pager has its own drag

  }, { passive: true });
  window.addEventListener('hashchange', () => { const h = readHash(); if (!h) return;
    if (h.mode === 'deck' && phone() && S.mode === 'news') { S.slide = h.n; goTo(slideToPage()); return; } // a slide link on a phone opens its page
    if (h.mode !== S.mode) { if (h.mode === 'deck') { S.mode = 'deck'; S.slide = h.n; render(true); } else setMode('news', h.n); } else if (h.mode === 'deck') goSlide(h.n); else if (h.n !== S.page) goTo(h.n); });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => render(), 120); });

  /* ---------- print ---------- */
  window.addEventListener('beforeprint', () => {
    const deck = S.mode === 'deck';
    ['#print', '#printSize'].forEach(q => { const o = $(q); if (o) o.remove(); });
    const box = document.createElement('div'); box.id = 'print'; box.className = 'still';
    box.innerHTML = deck ? SLIDES.map((d, i) => M.slide(d, i + 1, NS)).join('') : PLAN.map(M.page).join('');
    $$('.pg,.sl', box).forEach(el => el.classList.add('on'));
    $$('[data-count]', box).forEach(el => { el.textContent = el.dataset.count + (el.dataset.suffix || ''); });
    document.body.appendChild(box);
    const st = document.createElement('style'); st.id = 'printSize';
    st.textContent = `@page{size:${deck ? '1600px 900px' : '620px 860px'};margin:0}`;
    document.head.appendChild(st);
  });
  window.addEventListener('afterprint', () => { const b = $('#print'); b && b.remove(); const s = $('#printSize'); s && s.remove(); });

  /* ---------- quality check (?qa) ---------- */
  function runQA() {
    const bad = [], good = [];
    const T3 = lv => ALL.filter(x => x.lv === lv && x.pri === 3), T2 = lv => ALL.filter(x => x.lv === lv && x.pri === 2);
    LV.forEach(lv => {
      const sp = C.items[lv].split || [], sum = sp.reduce((a, b) => a + b, 0), n3 = T3(lv).length;
      if (n3 && sum !== n3) bad.push(`L${lv}: split מסתכם ל-${sum} אבל יש ${n3} פעילויות בקצרה`);
      if (T2(lv).length % 2) bad.push(`L${lv}: מספר הפעילויות בפוקוס (${T2(lv).length}) אי-זוגי, ואחת תעמוד לבד בעמוד`);
    });
    if (N % 2) bad.push(`יש ${N} עמודים. במספר אי-זוגי הגב לא נופל לבד בצד ימין`);
    PLAN.filter(p => p.two && p.n % 2).forEach(p => bad.push(`הכפולה "${p.thumb}" מתחילה בעמוד ${p.n}, אי-זוגי, ולכן שני חציה לא נפגשים בגיליון הפתוח. שנו את split של הרמה שלפניה`));
    const txt = JSON.stringify(C); if (/[\u2013\u2014]/.test(txt)) bad.push('נמצא קו מפריד ארוך או בינוני בתוכן');
    const areaNames = (C.areas || []).map(a => a.name).concat(C.crossArea || []);
    const A = window.ART || {};
    ALL.forEach(it => {
      if (it.pm && !(C.allowedPMs || []).includes(it.pm)) bad.push(`שם שלא ברשימת המאושרים: ${it.pm}`);
      ['title', 'unit', 'what'].forEach(f => { if (!it[f]) bad.push(`חסר ${f}: ${it.title || it.id}`); });
      if (![1, 2, 3].includes(it.pri)) bad.push(`תעדוף לא תקין (pri): ${it.title}`);
      if (!C.cats[it.cat]) bad.push(`קטגוריה לא מוכרת (cat): ${it.title}`);
      if (!(C.statuses || {})[it.status]) bad.push(`סטטוס לא מוכר: ${it.title}`);
      if (!areaNames.includes(it.area)) bad.push(`תחום לא ברשימת התחומים (area): ${it.title}`);
      if (it.pri < 3 && !it.h1) bad.push(`חסרה כותרת (h1): ${it.title}`);
      if (it.pri === 1 && !(it.media && it.media.src) && !(A.kinds || []).includes(it.art)) bad.push(`חסר איור רחב (art) או תמונה: ${it.title}`);
      if (it.pri === 2 && !(A.minis || []).includes(it.art)) bad.push(`חסר איור לאורך (art) לפעילות בפוקוס: ${it.title}`);
    });
    Object.keys(C.cats).filter(k => !C.cats[k].extra).forEach(k => { if (!(A.glyphs || []).includes(C.cats[k].glyph)) bad.push(`חסר סמל לקטגוריה: ${C.cats[k].name}`); });
    const waiting = ALL.filter(it => it.pri === 1 && !(it.media && (it.media.src || it.media.type === 'deck'))).length;
    try { if (!document.fonts.check('16px "Migdal RagSans"')) bad.push('הפונט Migdal RagSans לא נטען'); } catch (e) {}
    $$('.qa-over').forEach(x => x.classList.remove('qa-over'));
    const over = [], pager = isPager();
    // in the phone pager a page may scroll down inside itself, so a tall page is fine there; sideways never is
    const test = (el, where) => { const side = !el.matches('.pc,.slc') && el.scrollWidth > el.clientWidth + 2, tall = el.scrollHeight > el.clientHeight + 2 && !(pager && el.matches('.pc')); if (tall || side) { el.classList.add('qa-over'); over.push(where); } };
    S.els.forEach(pg => {
      const where = (S.mode === 'deck' ? 'שקף ' : 'עמוד ') + (pg.dataset.n || '');
      $$('.pc,.slc,.rows,.val,.ba>div,.flow>div,.lcard,.howto,.guide,.take,.tile,.gate dl,.gh,.fb,.p2 .cols,.s-p2 .cols,.band,.catb,.acard,.ccard,.agent,.tnext,.l0', pg).forEach(el => test(el, where));
      const pf = $('.pf', pg); if (pf && pf.previousElementSibling) { const a = pf.previousElementSibling.getBoundingClientRect(), b = pf.getBoundingClientRect(); if (a.bottom > b.top + 2 && a.height) { pf.classList.add('qa-over'); over.push(where + ' (נוגע בכותרת התחתונה)'); } }
    });
    if (pager) {
      S.els.forEach(pg => { const s = pg._sh; if (s && s.scrollWidth > s.clientWidth + 1) over.push('עמוד ' + pg.dataset.n + ' (לרוחב)'); });
      if (document.documentElement.scrollWidth > window.innerWidth) bad.push('הדף רחב מהמסך וגולש הצידה');
    }
    [...new Set(over)].forEach(o => bad.push('גלישת טקסט: ' + o));
    good.push(`${ALL.length} פעילויות · L1 ${TOK.L1} · L2 ${TOK.L2} · L3 ${TOK.L3} · L4 ${TOK.L4} · בשימוש ${TOK.active} · בפיילוט ${TOK.pilot} · בדרך ${TOK.soon}`);
    good.push(`בזרקור ${ALL.filter(x => x.pri === 1).length} · בפוקוס ${ALL.filter(x => x.pri === 2).length} · בקצרה ${ALL.filter(x => x.pri === 3).length} · ${waiting} עמודי זרקור עדיין בלי תמונה או סרטון`);
    good.push(`${N} עמודים · ${NS} שקפים · פריסה: ${S.mode === 'deck' ? 'מצגת' : S.lay.kind}`);
    const box = $('#qa');
    box.innerHTML = `<h4>בדיקת איכות</h4><ul>${bad.map(b => `<li class="bad">${esc(b)}</li>`).join('') || '<li class="good">לא נמצאו בעיות</li>'}${good.map(g => `<li>${esc(g)}</li>`).join('')}</ul>`;
    box.classList.add('show');
    window.__qa = { bad, good };
    return window.__qa;
  }

  /* ---------- boot ---------- */
  const h = readHash();
  if (h) { if (h.mode === 'deck') { S.mode = 'deck'; S.slide = h.n; } else S.page = h.n; }
  render(true);
  if (S.mode === 'deck') idle();
  const ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  ready.then(() => { if (Q.has('qa')) setTimeout(runQA, 900); });
  window.__mag = { step, goTo, goSlide, setMode, openCard, openPanel, closePanel, closeCard, runQA, state: S, N, NS, render };
})();
</script>
