<!DOCTYPE html>
<!--
  AI בחטיבה · גיליון 01 · אוקטובר 2026 · גרסה 3 (07/10/2026: פריסה לפי תעדוף, קטגוריות עסקיות, טיזר לגיליון 02)
  קובץ אחד שעומד בפני עצמו: פותחים בדפדפן, בלי אינטרנט ובלי התקנה.
  הקובץ הזה הוא גם המוצר וגם המקור. מפת הקובץ:
    [A] עיצוב (CSS) · [B] נכסים: פונטים ולוגו, מקודדים, לא לערוך ביד
    [1] התוכן · [2] אייקונים וגלים · [2ב] איורי הזרקור · [3] עמודי הניוזלטר · [4] שקפי המצגת · [5] מנוע
  לשינוי טקסט: חפשו "[1] התוכן". ההנחיות המלאות ב-CLAUDE.md וב-docs/EDITING.md שבתיקייה.
-->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="AI בחטיבה, גיליון 01: פעילויות ה-AI של החטיבה, בארבע רמות ובחמש קטגוריות עסקיות. ניוזלטר ומצגת בקובץ אחד.">
<meta name="color-scheme" content="light">
<title>AI בחטיבה · גיליון 01</title>
<script id="guard">
/* אם יש שגיאה בקוד (למשל פסיק חסר בבלוק התוכן [1]), מציגים הודעה בעברית עם מספר השורה, במקום מסך ריק. */
window.addEventListener('error', function (e) {
  if (document.getElementById('bootErr')) return; // the first error is the real cause; later ones are a cascade
  var b = document.createElement('div');
  b.id = 'bootErr'; b.setAttribute('role', 'alert');
  b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:64px;z-index:99;background:#fff4f4;color:#7a0014;border:2px solid #d0021b;border-radius:12px;padding:14px 16px;font:15px/1.5 system-ui,sans-serif;direction:rtl;text-align:right';
  b.textContent = 'הגיליון לא נטען במלואו בגלל שגיאה בקובץ: ' + (e.message || '') + (e.lineno ? ' (שורה ' + e.lineno + ')' : '') + '. אם ערכתם עכשיו את בלוק התוכן [1], בדקו פסיקים, מרכאות וסוגריים סביב השורה הזאת.';
  (document.body || document.documentElement).appendChild(b);
});
</script>
<style id="styles">
/* =====================================================================
   [A] עיצוב · STYLES
   שפה עיצובית: נייבי, מנטה ואינדיגו, פונט גאומטרי, גלולות ומספרי ענק, בשפת מצגת הדירקטוריון.
   צבעי הרמות: L1 מנטה · L2 ירוק עמוק · L3 אינדיגו · L4 נייבי.
   ===================================================================== */
:root{
  --ink:#020140;--ink2:#212058;--ink3:#2a2c5e;--blue:#3c65e3;--blue-d:#2a49ad;
  --mint:#a2eb9a;--mint7:#74cf6f;--green:#2f7d56;--ok:#46a173;
  --paper:#fbfbfd;--mist:#f3f6fb;--tint:#e7ecfb;--line-soft:#e1e9f3;--line:#d4ddec;--line-blue:#bdd2eb;
  --s4:#9aa3bd;--s5:#6b7596;--s6:#5b658a;--desk:#dfe6f0;
  --l1:#a2eb9a;--l2:#2f7d56;--l3:#3c65e3;--l4:#020140;
  --fd:"Migdal RagSans","Heebo","Assistant",system-ui,sans-serif;
  --fb:"Migdal RagSans","Assistant","Heebo",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --glow:radial-gradient(80% 70% at 84% 18%,rgba(61,101,227,.42) 0%,rgba(61,101,227,0) 58%),radial-gradient(70% 90% at 92% 108%,rgba(162,235,154,.26) 0%,rgba(162,235,154,0) 55%);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--desk)}
body{font-family:var(--fb);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
.ltr{direction:ltr;unicode-bidi:isolate}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hl{color:var(--blue)}
.ic-list,.ic-method,.ic-workflow,.ic-catAuto{transform:scaleX(-1)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- app frame ---------- */
#app{position:fixed;inset:0;overflow:hidden}
#desk{position:absolute;inset:0;background:radial-gradient(120% 120% at 50% 40%,#eef3fa 0%,#d7e1ee 100%);transition:background .4s}
.mode-deck #desk{background:radial-gradient(120% 100% at 50% 0%,#14153f 0%,#05052a 70%)}
#view{position:absolute;inset:0 0 48px 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
/* only the reader scrolls #view: elsewhere it cannot be scrolled at all, not even by focus */
.lay-spread #view,.lay-single #view,.mode-deck #view{overflow:clip}
#book{position:relative;flex:none;transform-origin:center center}
#stage{position:absolute;inset:0;transition:transform .72s cubic-bezier(.45,.05,.2,1)}
.lay-spread #book{width:1240px;height:860px}
.lay-single #book{width:620px;height:860px}
.mode-deck #book{width:1600px;height:900px}

/* ---------- page (newsletter) ---------- */
.pg{position:absolute;top:0;width:620px;height:860px}
.pg:focus,.sl:focus{outline:none}
.lay-spread .pg[data-side=L]{left:0}.lay-spread .pg[data-side=R]{left:620px}
.lay-single .pg{left:0}
.sheet{position:absolute;inset:0;background:#fff;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 40px rgba(2,1,64,.22),0 0 0 1px rgba(2,1,64,.05)}
.pg[data-side=R] .sheet{transform-origin:left center}.pg[data-side=L] .sheet{transform-origin:right center}
.pc{position:absolute;inset:0;padding:32px 36px 26px;display:flex;flex-direction:column;overflow:hidden;background:#fff;color:var(--ink)}
.gut{position:absolute;top:0;bottom:0;width:56px;pointer-events:none;z-index:2}
.pg[data-side=R] .gut{left:0;background:linear-gradient(90deg,rgba(2,1,64,.14),rgba(2,1,64,0))}
.pg[data-side=L] .gut{right:0;background:linear-gradient(270deg,rgba(2,1,64,.14),rgba(2,1,64,0))}
.pg[data-side=R] .gut.dk{background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,0))}
.pg[data-side=L] .gut.dk{background:linear-gradient(270deg,rgba(0,0,0,.35),rgba(0,0,0,0))}
.shade{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;background:linear-gradient(90deg,rgba(2,1,64,.28),rgba(2,1,64,.04))}
.turning .shade{animation:turnShade .62s ease-in-out}
@keyframes turnShade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.hz{position:absolute;top:0;bottom:0;width:34px;cursor:pointer;z-index:3}
.hz.nx{left:0}.hz.pv{right:0}
.lay-single .hz,.lay-reader .hz{display:none}
.lay-spread .pg[data-side=R] .hz.nx,.lay-spread .pg[data-side=L] .hz.pv{display:none} /* the spine turns nothing; only the outer edges do */

/* reveal on arrival */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.on [data-rv]{animation:rise .7s var(--ease) both;animation-delay:var(--d,0s)}
.still *{animation:none!important;transition:none!important}

/* ---------- shared page parts ---------- */
.ph{display:flex;align-items:center;justify-content:space-between;flex:none;height:22px}
.kick{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--blue)}
.kick>i{width:8px;height:8px;background:var(--mint);border-radius:2px;transform:rotate(45deg);flex:none}
.ldr{display:flex;align-items:flex-end;gap:3px;flex:none}
.ldr>span{width:14px;border-radius:2px;display:block}
.ldr>span:nth-child(1){height:7px;background:var(--l1)}.ldr>span:nth-child(2){height:11px;background:var(--l2)}
.ldr>span:nth-child(3){height:15px;background:var(--l3)}.ldr>span:nth-child(4){height:19px;background:var(--l4)}
.ldr[data-on]>span{opacity:.22}
.ldr[data-on="1"]>span:nth-child(1),.ldr[data-on="2"]>span:nth-child(2),.ldr[data-on="3"]>span:nth-child(3),.ldr[data-on="4"]>span:nth-child(4){opacity:1}
.ldr.inv>span:nth-child(4){background:#fff}
/* the marker on the level opener: the current level ringed (not "gate", which is the page class) */
.ldr.hi>span{opacity:.4}
.ldr.hi[data-on="1"]>span:nth-child(1),.ldr.hi[data-on="2"]>span:nth-child(2),.ldr.hi[data-on="3"]>span:nth-child(3),.ldr.hi[data-on="4"]>span:nth-child(4){opacity:1;box-shadow:0 0 0 2px currentColor}
.pf{display:flex;justify-content:space-between;align-items:center;flex:none;font-size:12px;color:var(--s5);letter-spacing:.04em;padding-top:12px;margin-top:auto}
.pf .brand{display:flex;align-items:center;gap:12px}
.lock{display:inline-flex;align-items:center;gap:6px;flex:none;color:var(--ink)}
.logo{display:block;flex:none;height:18px;width:44px;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.ai{direction:ltr;background:var(--mint);color:var(--ink);border-radius:999px;padding:2px 7px;font-family:var(--fd);font-weight:800;font-size:9px;line-height:1.2}
.lock.lg .logo{height:32px;width:78px}.lock.lg{gap:10px}.lock.lg .ai{font-size:13px;padding:4px 11px}
.lock.md .logo{height:28px;width:68px}.lock.md{gap:9px}.lock.md .ai{font-size:12px;padding:3px 10px}
.lock.inv{color:#fff}.lock.dk .ai{background:var(--ink);color:var(--mint)}
.pbar{position:absolute;bottom:0;right:0;height:3px;background:var(--blue)}
.rule{width:44px;height:4px;border-radius:2px;background:var(--mint)}
.st{display:inline-flex;align-items:center;gap:5px;font-weight:700;white-space:nowrap}
.st>i{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.st.soon{color:var(--blue)}.st.soon>i{background:var(--blue)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(2,1,64,.14)}
.pill{position:absolute;height:44px;border-radius:999px}

/* ---------- waves: filled silhouettes in currentColor, see [2] ---------- */
svg.wv{display:block;overflow:hidden;flex:none}
.wv-glyph path{stroke:currentColor;stroke-width:3.4;stroke-linejoin:round}
svg.wv path{fill:currentColor;stroke:none}
svg.wv .wv-eo{fill-rule:evenodd}
svg.wv .wv-cut{fill:var(--wv-bg,transparent)}
.wv-glyph{height:18px;width:auto}
/* motion: the swell breathes once per round and the rider rises with it; two rounds, ends on the rest frame */
@keyframes wvA-swell{0%,100%{transform:none}50%{transform:scaleY(1.03)}}
@keyframes wvA-ride{0%,100%{transform:none}50%{transform:translateY(var(--wv-rise,-.35px)) rotate(-1.2deg)}}
.wv-hero .wv-sea,.wv-hero .wv-surfer{transform-box:fill-box;transform-origin:50% 100%;animation:wvA-swell var(--wv-t,6s) ease-in-out 2}
.wv-hero .wv-surfer{animation-name:wvA-ride}
.wv-l1{--wv-t:7s;--wv-rise:-.74px}.wv-l2{--wv-t:6.4s;--wv-rise:-.31px}.wv-l3{--wv-t:5.8s;--wv-rise:-.3px}.wv-l4{--wv-t:5.2s;--wv-rise:-.35px}
.pg:not(.on) .wv *,.sl:not(.on) .wv *{animation-play-state:paused}
.wv.calm *{animation:none}
/* colour pairs for waves on each surface: accent / knock-out (the cut around the rider) */
.on-l1{--wv-acc:var(--ink);--wv-bg:var(--l1)}
.on-l2{--wv-acc:var(--mint);--wv-bg:var(--l2)}
.on-l3{--wv-acc:var(--mint);--wv-bg:var(--l3)}
.on-l4{--wv-acc:var(--mint);--wv-bg:var(--l4)}
.on-w{--wv-acc:var(--blue);--wv-bg:#fff}
.on-mist{--wv-acc:var(--blue);--wv-bg:var(--mist)}

/* ---------- cover ---------- */
.cover{background:var(--ink);color:#fff;padding:32px 36px 28px}
.glow{position:absolute;inset:0;background:var(--glow);pointer-events:none}
.cover .top,.back .top,.gate .top{display:flex;justify-content:space-between;align-items:center;flex:none;position:relative;z-index:1}
.issue{font-size:12px;letter-spacing:.14em;color:var(--mint);font-weight:700;white-space:nowrap}
.cover .mast{margin-top:46px;position:relative}
.cover .mast .rule{margin-bottom:16px}
.cover .mast h1{font:800 60px/1 var(--fd);letter-spacing:-.01em}
.cover .mid{position:relative;flex:1;min-height:0}
.cover .n41{position:absolute;right:0;top:50%;transform:translateY(-52%);font:900 300px/.85 var(--fd);letter-spacing:-.05em;color:#fff}
.cover .head{position:relative}
.cover .head h2{font:800 52px/1.02 var(--fd)}
.cover .head p{font-weight:200;font-size:23px;line-height:1.4;color:rgba(255,255,255,.88);margin-top:14px;max-width:30ch}
.cover .bot{display:flex;justify-content:space-between;align-items:center;margin-top:30px;font-size:12px;color:rgba(255,255,255,.62);letter-spacing:.06em;position:relative}

/* ---------- editorial ---------- */
.ed .blk{margin-top:64px}
.ed h2{font:800 42px/1.06 var(--fd);letter-spacing:-.01em;margin-top:18px}
.ed .body{font-weight:200;font-size:23px;line-height:1.5;margin-top:26px;text-wrap:pretty}
.ed .sign{margin-top:22px;font-size:13px;color:var(--s6)}
.howto{margin-top:auto;background:var(--mist);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.howto h3{font:800 14px/1.2 var(--fd);color:var(--ink)}
.howto .r{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:center;font-size:13.5px;line-height:1.4;color:var(--s6)}
.howto .k{display:flex;align-items:center;gap:3px;color:var(--ink);justify-content:flex-start}
.howto .k .wv-glyph{height:14px;width:auto}
.howto .k .st{font-size:12px}

/* ---------- table of contents ---------- */
.toc h2{font:800 36px/1.06 var(--fd);margin-top:40px}
.toc .trs{margin-top:20px;display:flex;flex-direction:column}
.toc .tr{display:grid;grid-template-columns:48px 6px 1fr auto;align-items:center;gap:14px;padding:12px 4px 12px 0;border:0;border-top:1px solid var(--line-soft);background:none;text-align:right;cursor:pointer;width:100%;font:inherit;color:inherit;transition:background .2s}
.toc .tr:last-child{border-bottom:1px solid var(--line-soft)}
.toc .tr:hover{background:var(--mist)}
.toc .tr .n{font:800 26px/1 var(--fd);color:var(--blue)}
.toc .tr .bar{width:6px;height:30px;border-radius:3px;background:var(--line-soft)}
.toc .tr .t{display:block;font:700 17px/1.2 var(--fd)}
.toc .tr .s{display:block;font-size:12.5px;color:var(--s5);margin-top:3px}
.toc .tr .wv-glyph{height:22px;width:auto;margin-left:6px}

/* ---------- numbers ---------- */
.num .lead{font-size:13px;font-weight:700;color:var(--s6);letter-spacing:.08em;margin-top:40px}
.num .big{display:flex;align-items:baseline;gap:16px;margin-top:4px}
.num .big .n{font:900 220px/.9 var(--fd);letter-spacing:-.04em}
.num .big .l{font:700 28px/1.1 var(--fd)}
.num .two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:38px;border-top:1px solid var(--line-soft);padding-top:26px}
.num .two .n{font:800 104px/.9 var(--fd);letter-spacing:-.03em;display:block}
.num .two .l{font:700 20px/1.2 var(--fd);margin-top:10px}
.num .two .s{font-size:13px;color:var(--s6);margin-top:3px;line-height:1.4}
.take{margin-top:auto;background:var(--ink);color:#fff;border-radius:12px;padding:16px 20px;font-size:16px;line-height:1.35}
.take b{color:var(--mint)}
.bylv h2,.bylv h3,.lad h3{font:800 26px/1.1 var(--fd)}
.bylv .h1{margin-top:40px}
.bylv .bar{display:flex;height:72px;margin-top:18px;gap:4px}
.bylv .bar>div{border-radius:12px;display:flex;align-items:center;justify-content:center;font:800 28px/1 var(--fd)}
.bylv .labs{display:flex;gap:4px;margin-top:9px}
.bylv .labs>div{text-align:center;font-size:12px;line-height:1.35;color:var(--s6);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.bylv .labs .wv-glyph{height:20px;width:auto;color:var(--ink)}
.bylv .labs span{font-weight:400}
.bylv .h2{margin-top:48px}
.bylv .note{font-size:14px;color:var(--s6);margin-top:6px}
.bylv .areas{display:flex;flex-wrap:wrap;gap:10px 10px;margin-top:18px}
.bylv .areas span{font-size:17px;font-weight:400;color:var(--ink);background:var(--mist);border-radius:999px;padding:9px 18px}

/* ---------- ladder ---------- */
.lad h2{font:800 40px/1.06 var(--fd);letter-spacing:-.01em;margin-top:38px}
.lad .body{font-size:16px;line-height:1.45;color:var(--s6);margin-top:14px;max-width:36ch;text-wrap:pretty}
.surfnote{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13.5px;line-height:1.4;color:var(--ink);background:var(--mist);border-radius:12px;padding:9px 12px}
.surfnote .gl{display:flex;align-items:flex-end;gap:2px;flex:none}
.surfnote .wv-glyph{height:16px;width:auto}
.stairs{position:relative;flex:1;min-height:0;margin-top:18px}
.lcard{position:absolute;width:70%;height:160px;border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:1fr 118px;gap:10px;cursor:pointer;border:0;text-align:right;font:inherit;transition:box-shadow .25s}
.lcard:hover{box-shadow:0 18px 48px rgba(2,1,64,.18)}
.lcard .c{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.lcard .k{display:flex;align-items:baseline;gap:10px}
.lcard .k b{font:900 44px/.9 var(--fd);letter-spacing:-.03em}
.lcard .k span{font-size:13px;font-weight:700}
.lcard .d{font-size:14px;line-height:1.35}
.lcard .m{font-size:12.5px;font-weight:700}
.lcard .wv-hero{width:118px;height:74px;align-self:end}
.lcard.lv1{background:var(--l1);color:var(--ink)}
.lcard.lv2{background:var(--l2);color:#fff}
.lcard.lv3{background:var(--l3);color:#fff}
.lcard.lv4{background:var(--l4);color:#fff}
.lcard.lv4 .k b{color:var(--mint)}
.dash{position:absolute;border-top:2px dashed var(--line)}
.climb{position:absolute;right:0;top:0;width:27%;font-size:12.5px;line-height:1.45;color:var(--s6);font-weight:700}
.climb .ic{display:block;margin-bottom:4px;color:var(--blue);transform:rotate(90deg)}
.guide{position:absolute;left:0;right:0;bottom:0;height:150px;background:var(--mist);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.guide h4{font:800 20px/1.15 var(--fd)}
.guide p{font-size:14px;line-height:1.45;color:var(--s6)}

/* ---------- level opener, over two facing pages ---------- */
.gate{padding:32px 36px 28px}
.gate.lv1{background:var(--l1);color:var(--ink)}
.gate.lv2{background:var(--l2);color:#fff}
.gate.lv3{background:var(--l3);color:#fff}
.gate.lv4{background:var(--l4);color:#fff}
.gate .top{position:relative;z-index:2}
.gate .chap,.gate .pgn{font-size:12px;font-weight:700;letter-spacing:.1em}
.gate.lv1 .rule{background:var(--ink)}
/* the wave: one drawing on both pages, centred on the fold, so the two halves meet when the issue is open */
/* the clip keeps the wave inside the page, so it bleeds off the edge without making the page taller */
.wclip{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
/* --ww the width of the whole drawing (both pages), --wb how far it sinks below the bottom edge. The waves of
   levels 3 and 4 are taller drawings, so they are a little smaller and their crest stays below the text */
.gate,.s-gate{--ww:1060px;--wb:-46px}
.gate.lv3{--ww:975px;--wb:-40px}
.gate.lv4{--ww:816px;--wb:-30px}
.bigwave{position:absolute;bottom:var(--wb);width:var(--ww);height:calc(var(--ww) * .625)}
.bigwave.onR{left:calc(var(--ww) / -2)}.bigwave.onL{right:calc(var(--ww) / -2)}
.bigwave .wv-hero{width:100%;height:100%}
.gate .gh{position:relative;z-index:1;margin-top:60px;padding-bottom:14px}

/* ---------- hero feature ---------- */

.hero .meta .lv{display:inline-flex;align-items:center;gap:6px}
.hero .meta .src{font-size:13px;font-weight:400;color:var(--s6)}
.hero h2{margin-top:18px;display:flex;flex-direction:column;gap:12px}
h2 .nm{display:flex;align-items:center;gap:10px;font:800 18px/1.2 var(--fd);color:var(--ink)}
h2 .nm .ico{width:32px;height:32px;border-radius:10px;background:var(--tint);display:inline-flex;align-items:center;justify-content:center;flex:none}

.val .big{font:800 40px/1.1 var(--fd);display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.val .big.txt{display:block;text-wrap:balance}
.val .big .ic{color:var(--green);flex:none}
.val .note{font-size:15px;color:var(--s6);line-height:1.4}
.val .grow{color:var(--green)}
.val.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:center}

.val>*:not(.wm){position:relative}
.ba{margin-top:16px;display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;align-items:stretch;min-height:132px}
.ba>div{border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.ba .b{background:var(--mist)}.ba .a{background:var(--ink);color:#fff}
.ba .x{background:none;padding:0;align-items:center;color:var(--s4)}

.ba .a .lab{color:var(--mint)}
.ba .t{font:700 17px/1.25 var(--fd)}
.ba .d{font-size:13px;line-height:1.4;color:var(--s6)}

.flow>div.hot{background:var(--ink);color:#fff}.flow>div.hot .i{background:var(--mint);color:var(--ink)}
.hero .take{margin-top:12px;font-size:14px;padding:12px 16px}
.parts{margin-top:16px}.parts .cap{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--s6);margin-bottom:8px}
.parts .flow{margin-top:0;min-height:96px}.parts .flow .i{width:10px;height:10px;background:var(--mint);border-radius:50%}
.s-hero .parts .cap{font-size:16px}.s-hero .parts .flow{min-height:170px}.s-hero .parts .flow .i{width:14px;height:14px}
.howto + .pf,.take + .pf{margin-top:16px}
.byline{margin-top:12px;font-size:12.5px;color:var(--s5)}

/* ---------- spotlight art: level colours and the stage ---------- */
/* each level tints its own pages: the stage behind the art, the list icons, the accents */
.lv1{--ar-bg:#a2eb9a;--ar-card:#fff;--ar-tint:#eefbec;--ar-soft:#d9f5d4;--ar-soft2:#b9e9b2;--ar-acc:#020140;--ar-acct:#020140;--ar-on:#fff;--ar-ink:#020140;--ar-mut:#3a4470;--ar-line:#cdebc8;--ar-code:#020140;--ar-kw:#a2eb9a;--ar-lift:rgba(2,1,64,.14);--lvh:var(--blue)}
.lv1 .art .acc2{fill:var(--blue)}
.lv2{--ar-bg:#e4f1e9;--ar-card:#fff;--ar-tint:#eef6f1;--ar-soft:#d3e8db;--ar-soft2:#b6dac4;--ar-acc:#2f7d56;--ar-acct:#2f7d56;--ar-on:#fff;--ar-ink:#020140;--ar-mut:#5b658a;--ar-line:#cde2d5;--ar-code:#020140;--ar-kw:#a2eb9a;--ar-lift:rgba(2,1,64,.09);--lvh:#2f7d56}
.lv3{--ar-bg:#e7edfc;--ar-card:#fff;--ar-tint:#f0f4fe;--ar-soft:#d8e1fa;--ar-soft2:#bccbf5;--ar-acc:#3c65e3;--ar-acct:#3c65e3;--ar-on:#fff;--ar-ink:#020140;--ar-mut:#5b658a;--ar-line:#d0daf5;--ar-code:#020140;--ar-kw:#a2eb9a;--ar-lift:rgba(2,1,64,.09);--lvh:var(--blue)}
.lv4{--ar-bg:#020140;--ar-card:#12115a;--ar-tint:#1a1966;--ar-soft:#232270;--ar-soft2:#2f2e80;--ar-acc:#a2eb9a;--ar-acct:#a2eb9a;--ar-on:#020140;--ar-ink:#fff;--ar-mut:#a9abd3;--ar-line:#2d2c78;--ar-code:#0a0948;--ar-kw:#a2eb9a;--ar-lift:transparent;--lvh:var(--blue)}
.hero.lv2 h2 .hl,.s-hero.lv2 h2 .hl,.list.lv2 .ttl .hl{color:var(--lvh)}
.list.lv2 .row .ico,.list.lv3 .row .ico{background:var(--ar-bg)}
.list.lv1 .row .ico{background:#dff6da}
.list.lv4 .row .ico{background:#e9eaf3}
.list.lv2 .row .n{color:var(--l2)}
.hero.lv1 h2 .nm .ico,.hero.lv2 h2 .nm .ico,.hero.lv3 h2 .nm .ico,.s-hero.lv1 h2 .nm .ico,.s-hero.lv2 h2 .nm .ico,.s-hero.lv3 h2 .nm .ico{background:var(--ar-bg)}
.stagewrap{flex:1 1 0;min-height:0;display:flex;margin-top:18px}
.stage{flex:1;min-height:0;background:var(--ar-bg);border-radius:20px;padding:14px 12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage .art{width:100%;height:100%;max-height:300px}
.art text{font-family:var(--fb)}.art .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.art .card{fill:var(--ar-card)}.art .lift{filter:drop-shadow(0 6px 12px var(--ar-lift))}
.art .soft,.art .bar{fill:var(--ar-soft)}.art .softs{fill:var(--ar-soft2)}.art .tint{fill:var(--ar-tint)}.art .tint2{fill:var(--ar-soft)}
.art .acc{fill:var(--ar-acc)}.art .acct{fill:var(--ar-acct)}.art .on{fill:var(--ar-on)}.art .on-bar{fill:var(--ar-on);opacity:.42}
.art .ink,.art .inkf{fill:var(--ar-ink)}.art .mut{fill:var(--ar-mut)}.art .mutf{fill:var(--ar-mut);opacity:.55}.art .dot{fill:var(--ar-mut);opacity:.35}
.art .tag{fill:var(--ar-card);stroke:var(--ar-mut);stroke-width:1;stroke-dasharray:3 3}
.art .code{fill:var(--ar-code)}.art .kw{fill:var(--ar-kw)}.art .cbar{fill:#fff;opacity:.22}.art .cchip{fill:#fff;opacity:.12}.art .con{fill:#fff}
.art .ln{fill:none;stroke:var(--ar-line);stroke-width:1.5}
.art .lnd{fill:none;stroke:var(--ar-mut);stroke-width:1.4;opacity:.45}
.art .lnk{fill:none;stroke:var(--ar-mut);stroke-width:2;opacity:.5}
.art .lndash{fill:none;stroke:var(--ar-mut);stroke-width:1.4;stroke-dasharray:4 4}
.art .lnacc{fill:none;stroke:var(--ar-acc);stroke-width:2.5}
.art .arw{fill:none;stroke:var(--ar-mut);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.art .arwacc{fill:none;stroke:var(--ar-acc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.art .accs{fill:none;stroke:var(--ar-acc);stroke-width:2.5;stroke-linecap:round}
.art .onst{fill:none;stroke:var(--ar-on);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.art .ring{fill:none;stroke-width:9}.art .ring.big{stroke-width:22}.art .ring.acc{fill:none;stroke:var(--ar-acc)}.art .ring.mutf{fill:none;stroke:var(--ar-mut)}.art .ring.softs{fill:none;stroke:var(--ar-soft2)}.art .ring.acc-st{stroke:var(--ar-acc);stroke-linecap:round}
.art .gauge{fill:none;stroke:var(--ar-soft2);stroke-width:14;stroke-linecap:round}.art .gauge.acc-st{stroke:var(--ar-acc)}
.art .needle{fill:none;stroke:var(--ar-ink);stroke-width:3;stroke-linecap:round}
.art .knob{fill:var(--ar-card);stroke:var(--ar-acc);stroke-width:2.5}
.art .cursor{fill:var(--ar-ink);stroke:var(--ar-card);stroke-width:1.5;stroke-linejoin:round}
.art .ripple{fill:none;stroke:var(--ar-acc);stroke-width:1.5;opacity:.35}
.art .track{fill:none;stroke:var(--ar-soft2);stroke-width:3}
.art .lnw{fill:none;stroke:var(--ar-card);stroke-width:2;opacity:.7}
.art .wbar{fill:#fff;opacity:.92}.art .p-mint{fill:#a2eb9a}.art .p-green{fill:#2f7d56;stroke:#a2eb9a;stroke-width:1}.art .p-blue{fill:#3c65e3}
.art .headset{fill:none;stroke:var(--ar-ink);stroke-width:6;stroke-linecap:round}.art .headset.thin{stroke-width:3}
/* the value, as one clean row under the art */
.vrow{margin-top:14px;border-top:2px solid var(--ar-acc,var(--mint));padding-top:12px;display:flex;flex-direction:column;gap:4px}
.lv1 .vrow{border-top-color:#a2eb9a;border-top-width:3px}
.vrow .lab{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--s6)}
.vrow .vb{font:800 27px/1.18 var(--fd);color:var(--ink);text-wrap:balance}
.vrow .vb.ft{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.vrow .vb .to,.vrow .vb .ic{color:var(--green)}
.vrow .vb .grow{color:var(--green)}
.vrow .vb .stat{font-size:40px;color:var(--ink);margin-left:4px}
.vrow .note{font-size:14.5px;color:var(--s6);line-height:1.4}
.hero.has-art .take{margin-top:12px}
.s-hero.has-art .cols{grid-template-columns:1fr 1.12fr;gap:56px}
.s-hero.has-art .l{justify-content:stretch}
.s-hero .stagewrap{margin-top:0;flex:none;align-self:stretch}
.s-hero.has-art .l{justify-content:center}
.s-hero .stage{border-radius:28px;padding:44px 32px}.s-hero .stage .art{max-height:none;height:auto}
.s-hero .vrow{margin-top:26px;padding-top:16px}.s-hero .vrow .lab{font-size:16px}.s-hero .vrow .vb{font-size:40px}.s-hero .vrow .vb .stat{font-size:64px}.s-hero .vrow .note{font-size:21px}

/* ---------- activity list ---------- */
.list .ttl{display:flex;align-items:baseline;justify-content:space-between;margin-top:22px;flex:none}
.list .ttl h2{font:800 24px/1.1 var(--fd)}
.list .ttl span{font-size:12.5px;color:var(--s5)}
.rows{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:10px;border-bottom:1px solid var(--line-soft)}
.row{flex:1 1 auto;display:grid;grid-template-columns:26px 44px minmax(0,1fr) 28px;gap:0 14px;align-content:center;align-items:start;border:0;border-top:1px solid var(--line-soft);padding:12px 4px 12px 2px;background:none;text-align:right;cursor:pointer;width:100%;font:inherit;color:inherit;transition:background .2s;min-height:0}
.row:hover{background:#f8fafd}
.row .n{font:800 15px/1 var(--fd);color:var(--blue);padding-top:8px;font-variant-numeric:tabular-nums;direction:ltr}
.row .ico{width:44px;height:44px;border-radius:12px;background:var(--mist);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.row .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.row .t{font:700 18px/1.22 var(--fd);text-wrap:pretty}
.row .mt{display:flex;flex-wrap:wrap;align-items:center;gap:2px 9px;font-size:12.5px;line-height:1.35;color:var(--s6)}
.row .mt .dot{color:var(--line-blue)}
.row .w{font-size:14.5px;line-height:1.42;color:var(--ink3);margin-top:3px;text-wrap:pretty}
.row .v{font-size:14px;line-height:1.4;font-weight:700;color:var(--ink);text-wrap:pretty}
.row .v b{color:var(--green)}
.row .go{align-self:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;background:#fff}
.list.wide .row{grid-template-columns:26px 56px minmax(0,1fr) 30px;gap:0 18px}
.list.wide .row .ico{width:56px;height:56px;border-radius:16px}
.list.wide .row .n{font-size:16px;padding-top:12px}
.list.wide .row .t{font-size:23px}
.list.wide .row .w{font-size:16px;line-height:1.45}
.list.wide .row .v{font-size:15px}
abbr[title]{text-decoration:underline dotted color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:3px;cursor:help}

/* ---------- back cover ---------- */
.back{background:var(--ink);color:#fff;padding:32px 36px 28px}
.back .blk{margin-top:auto;position:relative}
.back .blk .rule{margin-bottom:18px}
.back h2{font:800 62px/1 var(--fd);letter-spacing:-.01em}
.back .blk p{font-weight:200;font-size:21px;line-height:1.45;color:rgba(255,255,255,.88);margin-top:16px;max-width:31ch}
.wladder{margin-top:40px;position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
.wladder>div{display:flex;flex-direction:column;gap:6px}
.wladder .n{font:800 34px/1 var(--fd);direction:ltr;text-align:right}
.wladder .wv-hero{width:100%;height:auto;aspect-ratio:160/100}
.wladder .l{font-size:12px;font-weight:700;color:rgba(255,255,255,.72);direction:ltr;text-align:right}
.back .bot{display:flex;justify-content:space-between;align-items:center;margin-top:34px;font-size:12px;color:rgba(255,255,255,.6);letter-spacing:.06em;position:relative}

/* ---------- version 3: status, category tag ---------- */
/* three statuses: live (green dot), pilot (green ring), on the way (blue dot) */
.st.pilot{color:var(--green)}.st.pilot>i{background:transparent;box-shadow:inset 0 0 0 2px var(--ok)}
/* the business-category tag: one neutral style, the icon tells them apart; the level keeps the colour */
.ctag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px 0 8px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font:700 11.5px/1 var(--fb);white-space:nowrap;flex:none}
.ctag .ic{flex:none;color:var(--blue)}
.ctag.x{border-style:dashed;color:var(--s6)}.ctag.x .ic{color:var(--s5)}
.howto .k .ctag{height:20px;font-size:11px}
.howto .k .st+.st{margin-right:2px}

/* table of contents: the next issue */
.tnext{margin-top:auto;display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:end;text-align:right;border:0;border-radius:16px;padding:16px 20px;background:var(--ink);color:#fff;cursor:pointer;font:inherit;position:relative;overflow:hidden;transition:box-shadow .25s}
.tnext:hover{box-shadow:0 14px 36px rgba(2,1,64,.28)}
.tnext::after{content:"";position:absolute;inset:0;background:var(--glow);opacity:.8;pointer-events:none}
.tnext>*{position:relative;z-index:1}
.tnext .k{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--mint)}
.tnext .k>i{width:7px;height:7px;background:var(--mint);border-radius:2px;transform:rotate(45deg)}
.tnext .t{font:800 21px/1.15 var(--fd);margin-top:6px}.tnext .t .hl{color:var(--mint)}
.tnext .s{grid-column:1;font-size:13px;line-height:1.4;color:rgba(255,255,255,.8)}
.tnext .n{grid-column:2;grid-row:2/4;font:800 26px/1 var(--fd);color:var(--mint)}
.toc .trs+.tnext{margin-top:18px}

/* numbers: three counts in a row */
.num .three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:38px;border-top:1px solid var(--line-soft);padding-top:26px}
.num .three .n{font:800 88px/.9 var(--fd);letter-spacing:-.03em;display:block}
.num .three .l{font:700 18px/1.2 var(--fd);margin-top:10px}
.num .three .s{font-size:12.5px;color:var(--s6);margin-top:3px;line-height:1.4}
.stbar{margin-top:auto;display:flex;gap:4px}
.stbar>div{display:flex;flex-direction:column;gap:8px;min-width:64px}
.stbar>div>i{display:block;height:12px;border-radius:6px;background:var(--ok)}
.stbar>div.pilot>i{background:transparent;box-shadow:inset 0 0 0 2px var(--ok)}
.stbar>div.soon>i{background:var(--blue)}
.stbar span{font-size:13px;color:var(--s6);white-space:nowrap}.stbar span b{font:800 18px/1 var(--fd);color:var(--ink)}
.num .stbar+.take{margin-top:18px}

/* business areas and the teams they serve */
.bylv .h2{margin-top:34px}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acard{background:var(--mist);border-radius:12px;padding:10px 14px 11px;display:flex;flex-direction:column;gap:4px;min-width:0}
.acard .an{display:flex;align-items:baseline;gap:8px;min-width:0}
.acard .an b{font:800 15.5px/1.2 var(--fd)}
.acard .an span{font-size:11.5px;color:var(--s5);font-weight:700}
.acard .an em{margin-right:auto;font:800 15px/1 var(--fd);font-style:normal;color:var(--blue)}
.acard .at{font-size:12.5px;line-height:1.4;color:var(--s6)}
.bylv .cross{font-size:12.5px;color:var(--s6);margin-top:9px}

/* the business categories */
.cats h2{font:800 38px/1.08 var(--fd);letter-spacing:-.01em;margin-top:34px}
.cats .body{font-size:16px;line-height:1.5;color:var(--s6);margin-top:12px;max-width:42ch;text-wrap:pretty}
.cats .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.cblocks{display:flex;flex-direction:column;margin-top:16px}
.catb{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line-soft)}
.catb .gl{width:72px;height:72px;border-radius:18px;background:var(--mist);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.catb .gl svg{width:60px;height:60px}
.catb .cx{min-width:0}
.catb .cn{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.catb h3{font:800 21px/1.15 var(--fd)}
.catb .cn .ltr{font-size:12px;font-weight:700;color:var(--s5)}
.catb .cnt{margin-right:auto;display:inline-flex;align-items:center;gap:8px;align-self:center}
.catb .cnt em{font-style:normal;font-size:12px;font-weight:700;color:var(--blue);background:var(--tint);border-radius:999px;padding:3px 10px;white-space:nowrap}

.mf-fund .sl{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}.mf-fund .bx{fill:var(--ink)}.mf-fund .ln{stroke:var(--mint);stroke-width:3;stroke-linecap:round}
.mf-ar{position:relative;align-self:stretch;min-height:calc(var(--u)*4)}
.mf-ar.a1{grid-area:a1}.mf-ar.a2{grid-area:a2}.mf-ar.a3{grid-area:a3}
.mf-ar .ln{position:absolute;left:12%;right:8%;top:50%;height:calc(var(--u)*.35);background:var(--mint);border-radius:9px;opacity:.85}
.mf-ar svg{position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--mint);width:calc(var(--u)*2);height:calc(var(--u)*2)}
.mf-ar b{position:absolute;left:0;right:0;text-align:center;bottom:calc(50% + var(--u)*1);font:700 calc(var(--u)*1.15)/1.2 var(--fb);color:var(--mint);white-space:nowrap}
.mf-ar.a3 b{bottom:auto;top:calc(50% + var(--u)*2.2)}
.mf-coin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);border-radius:50%;background:var(--mint);color:var(--ink);font:800 calc(var(--u)*1.6)/calc(var(--u)*3.2) var(--fd);text-align:center;font-style:normal;box-shadow:0 0 0 calc(var(--u)*.6) rgba(162,235,154,.22)}
/* across (a slide, a one-page spotlight) there is room for the headings only, and the engine's sentence */
.mf .src p,.mf .chk p,.mf .end p,.mf-keys .l,.mf-att,.mf-bank{display:none}
.mf .chk .mf-doubt{font-size:calc(var(--u)*1.05)}
.fm .mf .src p,.fm .mf .chk p,.fm .mf .end p,.fm .mf-keys .l,.m .mf .src p,.m .mf .chk p,.m .mf .end p,.m .mf-keys .l{display:block}
.fm .mf-att,.fm .mf-bank,.m .mf-att,.m .mf-bank{display:flex}.fm .mf-bank,.m .mf-bank{display:block}
/* the full page of a spread: top to bottom, the approval and the fund side by side at the foot */
.fm .media.mfl{aspect-ratio:4/5}
.fm .mf{--u:1.55cqi;padding:0;align-content:center;grid-template-columns:1fr calc(var(--u)*7) 1fr;grid-template-rows:auto calc(var(--u)*7) auto calc(var(--u)*7) auto;
  grid-template-areas:"src src src" "a1 a1 a1" "eng eng eng" "a2 a2 a2" "chk a3 end";align-items:stretch}
.fm .mf-src{flex-direction:row;gap:calc(var(--u)*2)}.fm .mf-src .mf-c{flex:1}
.fm .mf-ar.a1 .ln,.fm .mf-ar.a2 .ln{left:50%;right:auto;top:8%;bottom:22%;width:calc(var(--u)*.35);height:auto;transform:translateX(-50%)}
.fm .mf-ar.a1 svg,.fm .mf-ar.a2 svg{left:50%;top:auto;bottom:0;transform:translateX(-50%) rotate(-90deg)}
.fm .mf-ar.a2 b{bottom:auto;top:35%;left:auto;right:calc(50% + var(--u)*1.6);text-align:right}
.fm .mf-ar.a3 b{display:none}
.m .fm .media.mfl,.m .media.mfl{aspect-ratio:4/5}.m .mf{--u:1.55cqi;padding:calc(var(--u)*2) 0;align-content:center;grid-template-columns:1fr calc(var(--u)*7) 1fr;grid-template-rows:auto calc(var(--u)*7) auto calc(var(--u)*7) auto;grid-template-areas:"src src src" "a1 a1 a1" "eng eng eng" "a2 a2 a2" "chk a3 end";align-items:stretch}
/* a screenshot in a browser window (type: 'screen') */
.bw{width:90cqi;height:calc(100% - 5cqi);display:flex;flex-direction:column;background:#fff;border-radius:2cqi 2cqi 0 0;overflow:hidden;box-shadow:0 3cqi 7cqi rgba(2,1,64,.2),0 .5cqi 1.2cqi rgba(2,1,64,.1)}
.bw-top{flex:none;display:flex;align-items:center;gap:2cqi;height:4.6cqi;padding:0 2cqi;background:#f3f4f8;border-bottom:1px solid #e3e5ee;direction:rtl}
.bw-url{flex:1;max-width:46cqi;margin:0 auto;height:2.8cqi;border-radius:2cqi;background:#fff;box-shadow:0 0 0 1px #e1e3ec;display:flex;align-items:center;justify-content:center;font:700 1.5cqi/1 var(--fb);color:#5b658a;white-space:nowrap;overflow:hidden}
.bw img{display:block;flex:1;width:100%;height:0;min-height:0;object-fit:cover;object-position:top}
/* the window rises from the bottom edge of the box and is cut by it */
.media.scr{align-items:flex-end;padding:0}
/* a product name set as a wordmark: the last word small and raised */
.wm{font-weight:900;letter-spacing:-.01em}
.wm sup{font-size:.48em;font-weight:800;vertical-align:.9em;margin-inline-start:.12em;color:var(--lvh,var(--blue))}
.mtag{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.92);border:1px dashed var(--s5);color:var(--s6);font:700 11px/1 var(--fb)}
.lv4 .mtag{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.45);color:rgba(255,255,255,.85)}
.hero.p1 .vrow{margin-top:12px}
.hero.p1 .take{margin-top:10px}
.hero.p1 .byline{margin-top:8px}

/* ---------- the first spotlight of a level, over two facing pages ---------- */
.ft .fb{flex:1;display:flex;flex-direction:column;justify-content:center}
.ft .fb .meta{margin-top:0}
.ft h2{margin-top:16px}
.ft h2 .tt{font-size:42px}
.ft .line{font-size:19px;max-width:none}
.ft .vrow{margin-top:22px}
.ft .vrow .vb{font-size:32px}
.ft .take{margin-top:16px}
.fm{padding:0;background:var(--ar-bg);display:flex;flex-direction:column;justify-content:center;align-items:center}
.fm .mm{width:100%;padding:0 28px}
.fm .media{aspect-ratio:16/10;flex:none;background:transparent;padding:0}
.fm .media.has{border-radius:18px;background:var(--ink)}
.fm .media .art{max-height:none}
.fm .mcap{position:absolute;left:36px;right:36px;bottom:26px;display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ar-mut)}
.fm .mcap b{color:var(--ar-ink)}

/* ---------- in focus (pri 2): a diptych. One band holds both pictures, two text columns below ---------- */
/* the same diptych on the page (.p2) and on the slide (.s-p2) */
.p2 .band,.s-p2 .band{flex:none;margin-top:16px;display:grid;grid-template-columns:1fr 1px 1fr;gap:0 24px;background:var(--ar-bg);border-radius:20px;padding:12px 16px;height:286px}
.p2 .band .s-a,.s-p2 .band .s-a{background:none;padding:0;border-radius:0}
.p2 .band>i,.s-p2 .band>i{background:rgba(2,1,64,.12);margin:18px 0}
.p2.lv4 .band>i,.s-p2.lv4 .band>i{background:rgba(255,255,255,.16)}
/* align-content:start keeps the rule between the columns as long as the text, not the page */
.p2 .cols,.s-p2 .cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);align-content:start;gap:0 24px;margin-top:26px}
.p2 .sc,.s-p2 .sc{min-width:0}
.p2 .vr,.s-p2 .vr{background:var(--line)}
.s-a.mob{display:none}
.vrow.sm{margin-top:10px;padding-top:8px;gap:2px}
.vrow.sm .lab{font-size:11px}
.vrow.sm .vb{font-size:17px;line-height:1.25}
.vrow.sm .vb .stat{font-size:28px}
.vrow.sm .note{font-size:12.5px}
/* one story: number and name, headline, one sentence, the value, the tags, and a small line for whom and by whom */
.s-x{display:flex;flex-direction:column;min-width:0}
.s-n{display:flex;align-items:baseline;gap:9px;border:0;background:none;padding:0;cursor:pointer;font:800 13px/1.3 var(--fd);color:var(--ink);text-align:right;width:fit-content;max-width:100%}
.s-n b{font:800 13px/1 var(--fd);color:var(--lvh,var(--blue));letter-spacing:.06em}
.s-n:hover span{text-decoration:underline;text-underline-offset:3px}
.s-h{font:800 26px/1.15 var(--fd);margin-top:9px;text-wrap:balance}
.s-h .hl{color:var(--lvh,var(--blue))}
.s-l{font-size:15px;line-height:1.55;color:var(--s6);margin-top:9px;text-wrap:pretty}
.s-x .vrow.sm{margin-top:14px}
.s-k{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:12px;font-weight:700;color:var(--s6)}
.s-f{font-size:11.5px;line-height:1.4;color:var(--s5);margin-top:6px}
.s-a{background:var(--ar-bg);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px}
.s-a .art{width:100%;height:100%}

/* in brief: the tag sits in the meta line */
.row .mt .ctag{height:19px;font-size:10.5px;padding:0 7px 0 6px}
.row .mt .ctag .ic{width:11px;height:11px}

/* ---------- the next issue (teaser page) ---------- */
.teaser{background:var(--ink);color:#fff;padding:32px 36px 26px}
.teaser .top{display:flex;justify-content:space-between;align-items:center;flex:none;position:relative;z-index:1}
.teaser .blk{margin-top:40px;position:relative}
.teaser .kick.inv{color:var(--mint)}
.teaser h2{font:800 46px/1.04 var(--fd);margin-top:14px;letter-spacing:-.01em}
.teaser h2 .hl{color:var(--mint)}
.teaser .blk p{font-weight:200;font-size:18px;line-height:1.45;color:rgba(255,255,255,.88);margin-top:14px;max-width:34ch}
.teaser .n02{position:absolute;left:-14px;top:300px;font:900 250px/.8 var(--fd);letter-spacing:-.05em;color:#14135a;pointer-events:none}
.teaser .first{margin-top:auto;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--mint);position:relative}
.agent{position:relative;margin-top:10px;background:#fff;color:var(--ink);border-radius:22px;padding:20px 22px;box-shadow:0 18px 48px rgba(0,0,0,.3)}
.agent .ah{display:flex;align-items:center;gap:14px}
.agent .av{width:56px;height:56px;border-radius:50%;background:var(--mint);color:var(--ink);font:900 28px/56px var(--fd);text-align:center;flex:none;box-shadow:0 0 0 6px rgba(162,235,154,.28)}
.agent .an{font:800 30px/1 var(--fd)}
.agent .ar{font-size:13px;font-weight:700;color:var(--blue);margin-top:6px;letter-spacing:.02em}
.agent .at{font-size:15px;line-height:1.5;color:var(--ink3);margin-top:14px;text-wrap:pretty}
.agent .af{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--s4)}
.agent .af .s{background:var(--mist);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.agent .af .fork{display:flex;flex-direction:column;gap:6px}
.agent .af .o{border:1.5px dashed var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.agent .af .o.go{background:var(--mint);border:1.5px solid var(--mint)}
.teaser .more{position:relative;margin-top:16px;display:flex;align-items:center;gap:14px;font-size:14px;line-height:1.4;color:rgba(255,255,255,.78)}
.teaser .more .gs{display:flex;gap:8px;flex:none}
.ghost{width:50px;height:62px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ghost .av{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.12);color:rgba(255,255,255,.6);font:800 13px/24px var(--fd);text-align:center}
.ghost .b1,.ghost .b2{height:4px;border-radius:2px;background:rgba(255,255,255,.16)}.ghost .b1{width:28px}.ghost .b2{width:18px}
.teaser .bot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-size:12px;color:rgba(255,255,255,.6);letter-spacing:.06em;position:relative}

/* ---------- chrome ---------- */
#bar{position:absolute;left:0;right:0;bottom:0;height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;background:#fff;border-top:1px solid var(--line);z-index:30;font-size:12px;color:var(--ink)}
#bar .grp{display:flex;align-items:center;gap:8px;min-width:0}
#bar .ttl{font:800 13px/1 var(--fd);white-space:nowrap}
#bar .iss{color:var(--s5);white-space:nowrap}
#bar .ctr{font-weight:700;min-width:150px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.cb{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-soft);background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 12px var(--fb);color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .2s}

#prog i{position:absolute;right:0;top:0;bottom:0;background:var(--blue);transition:width .6s var(--ease)}
.navbtn{position:absolute;top:50%;margin-top:-48px;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.88);color:var(--ink);display:flex;align-items:center;justify-content:center;z-index:20;cursor:pointer;box-shadow:0 4px 12px rgba(2,1,64,.08);transition:opacity .25s,box-shadow .2s,background .2s}
.navbtn:hover{background:#fff;box-shadow:0 12px 32px rgba(2,1,64,.18)}
.navbtn.nx{left:14px}.navbtn.pv{right:14px}
.navbtn[disabled]{opacity:.25;pointer-events:none}
.mode-deck .navbtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.lay-reader .navbtn,.nonav .navbtn{display:none}

/* deck chrome: dark, auto-hiding */
.mode-deck #bar{background:rgba(5,5,42,.86);border-top-color:rgba(255,255,255,.1);color:#fff;transition:opacity .35s,transform .35s}
.mode-deck #bar .iss{color:rgba(255,255,255,.6)}
.mode-deck #bar .cb{background:transparent;border-color:rgba(255,255,255,.2);color:#fff}

#app.black::after{content:"";position:absolute;inset:0;z-index:35;background:#000}
.mode-deck.idle{cursor:none}
.only-news{}.mode-deck .only-news{display:none!important}

/* ---------- panels ---------- */
#scrim{position:absolute;inset:0;background:rgba(2,1,64,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.show{opacity:1;pointer-events:auto}
.panel{position:absolute;z-index:41;background:#fff;color:var(--ink);box-shadow:0 18px 48px rgba(2,1,64,.3);display:none}
.panel.show{display:flex}
.panel .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel h2{font:800 18px/1.2 var(--fd)}
.xbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-soft);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.xbtn:hover{background:var(--mist)}
#thumbs{left:0;right:0;bottom:48px;border-radius:16px 16px 0 0;padding:14px 20px 16px;flex-direction:column;gap:8px}
#thumbs .hd .acts{display:flex;gap:8px;align-items:center}
#thumbs .strip{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 6px;scrollbar-width:thin}
.th{width:66px;height:90px;flex:none;border-radius:8px;padding:8px;display:flex;flex-direction:column;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);text-align:right;font:inherit;position:relative}
.th .n{font:800 18px/1 var(--fd);direction:ltr;text-align:right}
.th .t{font-size:10px;line-height:1.25;margin-top:auto;opacity:.9}
.th .t b{display:block;font-weight:800;font-size:10.5px}
.th .wv-glyph{position:absolute;left:6px;top:6px;height:14px;width:auto}
.thi{flex:none;display:flex}
.th.cur{border:2px solid var(--blue);box-shadow:0 0 0 3px rgba(61,101,227,.25)}
.mode-deck .th{width:112px;height:66px}
#finder,#gloss{left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100vw - 32px));max-height:min(760px,calc(100vh - 96px));border-radius:20px;padding:20px 22px 12px;flex-direction:column;gap:12px}
#gloss{width:min(640px,calc(100vw - 32px))}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px;color:var(--s6)}
.srch input{flex:1;border:0;outline:0;font:400 16px var(--fb);color:var(--ink);background:transparent;min-width:0}
.srch:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,101,227,.18)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;gap:6px;font:700 12.5px var(--fb);color:var(--ink);cursor:pointer}
.chip .wv-glyph{height:16px;width:auto}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .sw{width:9px;height:9px}
.fcount{font-size:12.5px;color:var(--s6)}
.results{overflow-y:auto;min-height:0;flex:1;display:flex;flex-direction:column;margin:0 -8px;padding:0 8px}
.res{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 6px;border:0;border-top:1px solid var(--line-soft);background:none;text-align:right;cursor:pointer;font:inherit;color:inherit;width:100%}
.res:hover,.res:focus-visible{background:var(--mist)}
.res .ico{width:40px;height:40px;border-radius:11px;background:var(--mist);display:flex;align-items:center;justify-content:center}
.res .t{font:700 15.5px/1.25 var(--fd)}
.res .u{font-size:12.5px;color:var(--s6);margin-top:2px}
.res .lvt{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--s6);white-space:nowrap}
.empty{padding:28px 6px;text-align:center;color:var(--s6);font-size:14px}
.gl{overflow-y:auto;min-height:0;margin:0 -8px;padding:0 8px}
.gl dl{margin:0}
.gl dl>div{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:10px 0;border-top:1px solid var(--line-soft)}
.gl dt{font:700 15px/1.3 var(--fd)}
.gl dd{margin:0;font-size:14.5px;line-height:1.45;color:var(--ink3)}
.gl .gnote{font-size:12px;color:var(--s5);padding:10px 0 4px}

/* activity card (overlay) */
#card{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,1,64,.55)}
#card.show{display:flex}
#card .dlg{background:#fff;border-radius:22px;max-width:680px;width:100%;max-height:100%;overflow:auto;box-shadow:0 18px 48px rgba(2,1,64,.32);color:var(--ink);display:flex;flex-direction:column;user-select:text}
#card .strip{height:6px;flex:none}
#card .in{padding:20px 28px 22px;display:flex;flex-direction:column;gap:16px}
#card .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
#card .tags{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;color:var(--s6);flex-wrap:wrap}
#card .tags .dot{color:var(--line-blue)}
#card .tags .wv-glyph{height:18px;width:auto;color:var(--ink)}
#card .ttl{display:flex;align-items:flex-start;gap:16px}
#card .ttl .ico{width:56px;height:56px;border-radius:16px;background:var(--mist);display:flex;align-items:center;justify-content:center;flex:none}
#card h3{font:800 29px/1.12 var(--fd);text-wrap:pretty}
#card .unit{font-size:14.5px;color:var(--s6);margin-top:8px}
#card .unit b{font-weight:400;color:var(--s5)}
#card .lab{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--s5)}
#card .what{font-size:18px;line-height:1.55;margin-top:6px;text-wrap:pretty}
#card .valbox{background:var(--ink);color:#fff;border-radius:14px;padding:16px 20px}
#card .valbox .lab{color:var(--mint)}
#card .valbox p{font:700 20px/1.35 var(--fd);margin-top:6px;text-wrap:pretty}
/* the full story in the card */

/* ---------- QA overlay (#qa) ---------- */

/* ---------- presentation slides (1600x900) ---------- */
.sl{position:absolute;inset:0;overflow:hidden;visibility:hidden;background:#fff;color:var(--ink)}

/* statement */

/* numbers */

.s-gate{--ww:1270px;--wb:-60px}.s-gate.lv2{--ww:1300px}.s-gate.lv3{--ww:1050px}.s-gate.lv4{--ww:845px}

/* hero */
.s-hero .cols{display:grid;grid-template-columns:1fr 1fr;gap:64px;flex:1;min-height:0;margin-top:28px}
.s-hero .r{display:flex;flex-direction:column;justify-content:center;min-width:0;padding-bottom:40px}

.s-hero .line{font-size:26px;line-height:1.45;color:var(--s6);margin-top:22px;text-wrap:pretty}

/* activity tiles */
.s-tiles .hd{display:flex;align-items:center;gap:18px;margin-top:22px}

.s-num .three{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.s-num .three .n{font:800 120px/.9 var(--fd);letter-spacing:-.03em;display:block}

.s-areas .hd{margin-top:46px}

.ccard{background:var(--mist);border-radius:22px;padding:24px 22px 20px;display:flex;flex-direction:column;gap:8px;min-height:440px}

/* ---------- reader layout: pages stacked in a vertical scroll at natural size ---------- */
.lay-reader #view{display:block;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.lay-reader #book{width:auto;height:auto;transform:none!important;margin:0 auto;padding:24px 16px 40px}
.lay-reader #stage{position:relative;inset:auto;transform:none!important;display:flex;flex-direction:column;align-items:center;gap:22px}
.lay-reader .pg{position:relative;left:auto;top:auto;flex:none}
.lay-reader .sheet{transform:none!important}
.lay-reader .gut{display:none}

/* ---------- phone (.m): fluid pages, same design ---------- */
.m #view{inset:0 0 56px 0}
.m #bar{height:56px;padding:0 8px;gap:6px}
.m #prog{bottom:56px}
.m #bar .brandg,.m [data-fs]{display:none}
.m #bar .lbl{display:none}
.m .cb{padding:0 10px}
.m .seg button{padding:0 9px}
.m #bar .ctr{min-width:0}
.m #bar .ctr .full{display:none}.m #bar .ctr .short{display:inline}
.m #thumbs{bottom:56px}
.m #book{padding:10px 0 24px}
.m #stage{gap:12px}
.m .pg{width:min(100vw,480px);height:auto}
.m .sheet{position:relative;inset:auto;box-shadow:0 6px 18px rgba(2,1,64,.12)}
.m .pc{position:relative;inset:auto;min-height:calc(100vh - 56px - 22px);min-height:calc(100svh - 56px - 22px);padding:22px 18px 20px}
.m .pbar{height:3px}
.m .cover .mast{margin-top:30px}.m .cover .mast h1{font-size:44px}
.m .cover .mid{min-height:210px}.m .cover .n41{font-size:190px}
.m .cover .head h2{font-size:38px}.m .cover .head p{font-size:18px}
.m .cover .pill,.m .back .pill{transform:scale(.62);transform-origin:left center}
.m .back .pill{transform-origin:right center}
.m .ed .blk{margin-top:30px}.m .ed h2{font-size:31px}.m .ed .body{font-size:18.5px;margin-top:18px}
.m .howto{margin-top:22px}.m .howto .r{grid-template-columns:112px 1fr;font-size:13px}
.m .toc h2{font-size:30px;margin-top:26px}
.m .num .lead{margin-top:26px}.m .num .big .n{font-size:150px}.m .num .big .l{font-size:22px}
.m .num .two .n{font-size:76px}.m .num .two{margin-top:24px}
.m .take{margin-top:24px}
.m .bylv .h1{margin-top:26px}.m .bylv .bar>div{font-size:21px}.m .bylv .h2{margin-top:34px}
.m .bylv .areas span{font-size:15px;padding:8px 14px}
.m .lad h2{font-size:31px;margin-top:24px}
.m .stairs{position:static;display:flex;flex-direction:column;gap:10px;margin-top:16px}
.m .stairs .dash{display:none}
.m .lcard{position:relative;left:auto!important;right:auto!important;bottom:auto!important;width:100%;height:auto;min-height:146px;grid-template-columns:1fr 104px}
.m .lcard .wv-hero{width:104px;height:65px}
.m .climb{position:static;width:auto}.m .guide{position:static;height:auto}
.m .val .wm{display:none}
.m .gate{padding-bottom:300px;--ww:780px;--wb:-34px}.m .gate.lv3{--ww:700px}.m .gate.lv4{--ww:600px}
.m .gate .gh{margin-top:34px}.m .gate .L{font-size:150px}
.m .gate .en{font-size:24px}.m .gate .tag{font-size:18px}
.m .gate dl{margin-top:26px}.m .gate dl>div{grid-template-columns:1fr;gap:2px}
.m .gate dd{font-size:15.5px}
.m .gate .cnt .n{font-size:58px}
.m .ft .fb{flex:none;justify-content:flex-start;margin-top:22px}.m .ft h2 .tt{font-size:30px}.m .ft .line{font-size:16px}.m .ft .vrow .vb{font-size:24px}
.m .fm .mm{padding:0 14px}
.m .hero .meta{margin-top:18px}.m .hero h2{gap:10px}.m .hero h2 .nm{font-size:16px}.m .hero h2 .tt{font-size:29px}.m .hero .line{font-size:16px}
.m .val{flex:none;min-height:0;margin-top:18px;padding:18px}.m .val .big{font-size:27px}
.m .stagewrap{flex:none;margin-top:16px}.m .stage{padding:10px 6px;border-radius:16px}.m .stage .art{height:auto}.m .vrow .vb{font-size:22px}.m .vrow .vb .stat{font-size:34px}.m .val .stat{font-size:46px}.m .val.split .also{font-size:21px}.m .val.one .note{font-size:17px}.m .parts .flow{grid-template-columns:1fr 1fr}
.m .ba{grid-template-columns:1fr;min-height:0}.m .ba .x{transform:rotate(-90deg);height:24px}
.m .flow{grid-template-columns:1fr 1fr;min-height:0}
.m .list .ttl{margin-top:16px}
.m .rows{flex:none}
.m .row{flex:none;grid-template-columns:22px 38px minmax(0,1fr);gap:0 10px;padding:14px 0}
.m .row .go{display:none}
.m .row .ico,.m .list.wide .row .ico{width:38px;height:38px;border-radius:11px}
.m .row .t,.m .list.wide .row .t{font-size:17px}
.m .row .w,.m .list.wide .row .w{font-size:14.5px}
.m .list.wide .row{grid-template-columns:22px 38px minmax(0,1fr);gap:0 10px}
.m .back h2{font-size:46px}.m .back .blk p{font-size:18px}.m .wladder{margin-top:28px}.m .wladder .n{font-size:27px}
.m .pf{padding-top:16px}
/* version 3 on the phone */
.m .num .three{gap:10px}.m .num .three .n{font-size:54px}.m .num .three .l{font-size:14px}.m .num .three .s{font-size:11.5px}
.m .agrid{grid-template-columns:1fr}
.m .cats h2{font-size:30px;margin-top:24px}.m .cats .body{font-size:15px}
.m .catb,.m .cblocks.big .catb{grid-template-columns:56px minmax(0,1fr);gap:12px;padding:20px 0}.m .cblocks.big .catb h3{font-size:22px}.m .cblocks.big .catb .sh{font-size:16px}.m .cblocks.big .catb .lg{font-size:14.5px}
.m .catb .gl,.m .cblocks.big .catb .gl{width:56px;height:56px;border-radius:14px}.m .catb .gl svg,.m .cblocks.big .catb .gl svg{width:46px;height:46px}
.m .cfoot{margin-top:16px}
.m .l0{position:relative;inset:auto;height:auto;min-height:48px;padding:10px 14px;flex-wrap:wrap}
.m .hero.p1 h2 .tt{font-size:28px}.m .hero.p1 .line{font-size:15.5px}
.m .mwrap{flex:none;min-height:0;max-height:none}.m .media{aspect-ratio:16/10}
.m .p2 .band{display:none}
.m .p2 .cols{flex:none;grid-template-columns:1fr;gap:0;margin-top:16px}
.m .p2 .vr{height:1px;margin:24px 0}
.m .s-a.mob{display:flex;height:250px;margin-bottom:16px}
.m .s-h{font-size:23px}
.m .tnext{margin-top:20px}.m .tnext .t{font-size:18px}
.m .teaser .blk{margin-top:28px}.m .teaser h2{font-size:36px}.m .teaser .first{margin-top:28px}
.m .agent .af{flex-wrap:wrap}

/* narrow screens: the card's bottom navigation fits (no keyboard hint), the glossary is one column */
@media (max-width:520px){#card{padding:10px}#card .in{padding:16px 18px 18px}#card .nav>span{display:none}#card .nav .cb{padding:0 10px}}
@media (max-width:639.98px){.gl dl>div{grid-template-columns:1fr;gap:3px}}

/* ---------- phone: one page at a time ---------- */
/* no presentation mode on phones */
@media (max-width:639.98px){#bar .seg{display:none}}
.mfade,.mdim{display:none}
@supports (height:100dvh){#app.lay-mobile{bottom:auto;height:100dvh}}
.lay-mobile #view{display:block;bottom:calc(56px + env(safe-area-inset-bottom,0px));touch-action:pan-y pinch-zoom}
.lay-mobile #view.dragging{user-select:none;-webkit-user-select:none}
.lay-mobile #book{position:absolute;inset:0;width:auto;height:auto;padding:0;overflow:hidden;transform:none!important}
.lay-mobile #stage{inset:0;transform:none!important;transition:none}
/* every page is a full-screen card; only the current one and, while moving, one neighbour are visible */
.lay-mobile .pg{inset:0;width:auto;height:auto;visibility:hidden;contain:layout paint;box-shadow:0 0 40px rgba(2,1,64,.26)}
.lay-mobile .pg.mv{will-change:transform}
.lay-mobile .sheet{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y pinch-zoom;box-shadow:none;transform:none!important;scrollbar-width:none}
.lay-mobile .sheet::-webkit-scrollbar{display:none}
.lay-mobile .pc{min-height:100%;touch-action:pan-y pinch-zoom;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-left:calc(18px + env(safe-area-inset-left,0px));padding-right:calc(18px + env(safe-area-inset-right,0px))}
.lay-mobile.zoomed #view,.lay-mobile.zoomed .sheet,.lay-mobile.zoomed .pc{touch-action:auto}
.lay-mobile .gut,.lay-mobile .hz,.lay-mobile .shade,.lay-mobile .navbtn{display:none}
.lay-mobile .mfade{display:block;position:absolute;left:0;right:0;bottom:0;height:56px;z-index:5;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--pgbg,#fff) 85%);opacity:0;transition:opacity .3s}
.lay-mobile .pg.more .mfade{opacity:1}
.lay-mobile .mdim{display:block;position:absolute;inset:0;z-index:6;pointer-events:none;background:var(--ink);opacity:0}
/* indicator: a thin line at the top in the level colour, and "5 / 26" in the bar */
.lay-mobile #prog{top:env(safe-area-inset-top,0px);bottom:auto;height:3px}
.lay-mobile #prog i{transition:width .42s var(--ease),background-color .42s}
.lay-mobile #bar{height:calc(56px + env(safe-area-inset-bottom,0px));padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.lay-mobile #bar .cb{height:44px;min-width:44px;padding:0 12px}
.lay-mobile #bar .cb.i{width:44px;padding:0}
.lay-mobile #bar .tools .cb{border-color:transparent;background:transparent}
.lay-mobile #bar .cb:active{background:var(--mist)}
.lay-mobile #bar .ctr{min-width:62px;font-size:14px}
.lay-mobile #bar .ctr .of{font-weight:400;color:var(--s5)}
.lay-mobile #thumbs{bottom:calc(56px + env(safe-area-inset-bottom,0px))}

/* ---------- print (all pages or all slides, one per sheet) ---------- */
#print{display:none}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #app{display:none!important}
  #print{display:block!important}
  #print .pg,#print .sl{position:relative!important;left:auto!important;top:auto!important;visibility:visible!important;opacity:1!important;transform:none!important;break-after:page;page-break-after:always;overflow:hidden}
  #print .pg{width:620px;height:860px}
  #print .sl{width:1600px;height:900px}
  #print .sheet{transform:none!important;box-shadow:none!important}
  #print .gut,#print .hz,#print .shade,#print .row .go{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

@media (prefers-reduced-motion:reduce){
  .wv *{animation:none!important}
  .on [data-rv]{animation:none!important}
  #stage,.sheet{transition:none!important}
}

  // drawn breaking right, mirrored on output so every wave breaks left, in the reading direction
  const M = w => `matrix(-1 0 0 1 ${w} 0)`;
  const P = (d, c) => `<path${c ? ` class="${c}"` : ''} d="${d}"/>`;
  function hero(lv, opt) {
    const h = HERO[lv], o = opt || {};
    const sea = h.sea.map((d, i) => P(d, i === 0 && lv === 1 ? 'wv-eo' : '')).join('');
    return `<svg class="wv wv-hero wv-l${lv}${o.cls ? ' ' + o.cls : ''}" viewBox="0 0 160 100" aria-hidden="true" focusable="false">` +
      `<g transform="${M(160)}"><g class="wv-sea">${sea}</g>` +
      (o.noRider ? '' : `<g class="wv-surfer">${P(h.cut, 'wv-cut')}${P(h.man)}</g>`) + `</g></svg>`;
  }

  D.pricing = () =>

  // L4 · מודל הונאות אמבולטורי: תביעה, ציון סיכון עם הסבר, ופיצול למסלול ירוק או לבדיקה אנושית
  D.fraud = () =>

  // L4 · ניוד יוצא בפנסיה: ארבעה שלבים אוטומטיים, ו-60% מהבקשות בטיפול מלא
  D.donut = () => {

    return P('M120 26V112', 'track') + P('M120 120V156', 'lnacc') +

      `<circle cx="120" cy="216" r="50" class="ring big softs"/><circle cx="120" cy="216" r="50" class="ring big acc-st" pathLength="100" stroke-dasharray="60 100" transform="rotate(-90 120 216)"/>` +
      T(120, 229, '60%', { a: 'c', s: 34, w: 800, ltr: true });
  };
  }

  // ---------- A · רחב (זירת התביעות, תקלות, בקרת תמחור, KMS) ו-G · סמלי הקטגוריות ----------
  {
  const D = {};
  // ===== p1_c · four landscapes (arena, defects, pricectl, kms) and five category glyphs =====

  // a cluster of small volume bars centred on x, standing on a baseline
  const pC_bars = (cx, base, hs, cls) => hs.map((h, i) => R(cx - (hs.length * 10 - 4) / 2 + i * 10, base - h, 6, h, 3, cls)).join('');

  // L2 · זירת התביעות האמבולטוריות: מסלול התביעה מלמעלה, עד התביעה הבודדת; הסימולטור מתחת
  D.arena = () => frame(20, 14, 480, 244,

      pC_bars(x, 86, hs, 'softs') + C(x, 100, 7.5, 'knob') + T(x, 127, t, { a: 'c', s: 13 })).join('') +
    R(36, 142, 448, 104, 12, 'tint') +
    [[168, 34, 76], [194, 46, 38], [220, 28, 96]].map(([y, lw, v]) => R(468 - lw, y - 3.5, lw, 7, 3.5, 'soft') +

  D.defects = () => {

  // L3 · בקרת תמחור רכב: החלטות המחיר על ציר אחד, החידושים מתחתיו, מגמה וחריגה
  D.pricectl = () => {

  // L4 · בוט מנהלת ידע: הנציג שואל, התשובה מיידית ומתוך הנהלים, כרגע עם 30 נציגים
  D.kms = () => {

  // ---------- category glyphs (64x64, brand colours) ----------
  // one family: navy 2.5 strokes with round ends, rx 3 corners, white shapes, one mint highlight, one blue "engine"
  const pC_K = { n: '#020140', m: '#a2eb9a', b: '#3c65e3', l: '#c9d6ee', w: '#ffffff' };

  };

  // סוכן חכם: ניצוץ אחד שמחזיר מסמך גמור
  D.g_agent = () => {
    const k = pC_K;
    return `<rect x="11" y="18" width="23" height="34" rx="3" fill="${k.w}"/>` +
      `<path d="M11 27.5V21A3 3 0 0 1 14 18H31A3 3 0 0 1 34 21V27.5Z" fill="${k.m}"/>` +
      `<rect x="11" y="18" width="23" height="34" rx="3" fill="none" ${pC_st()}/>` +
      `<path d="M11 27.5H34M17 35H28M17 41H28M17 47H23" fill="none" ${pC_st()}/>` +
      `<path d="M46 11.5C47 16.7 48.3 18 53.5 19C48.3 20 47 21.3 46 26.5C45 21.3 43.7 20 38.5 19C43.7 18 45 16.7 46 11.5Z" fill="${k.b}" stroke="${k.b}" stroke-width="1" stroke-linejoin="round"/>` +

  // אוטומציה: שלושה צעדים על לולאה שרצה לבד
  D.g_auto = () => {

    return `<circle cx="32" cy="33" r="16" fill="none" ${pC_st()}/>` +
      `<path d="M35.5 45.5L32 49L35.5 52.5" fill="none" ${pC_st()}/>` +

      `<path d="M28.5 27.5L38 33L28.5 38.5Z" fill="${k.b}" stroke="${k.b}" stroke-width="2.5" stroke-linejoin="round"/>`;
  };

  // מערכת סוכנים: מרכז אחד, ארבעה סוכנים ואוטומציות סביבו
  D.g_system = () => {
    const k = pC_K;
    return `<rect x="17" y="17" width="30" height="30" rx="8" fill="none" stroke="${k.l}" stroke-width="2.5"/>` +

      `<circle cx="47" cy="47" r="5.5" fill="${k.m}" ${pC_st()}/>` +

      `<rect x="11.5" y="41.5" width="11" height="11" rx="3" fill="${k.w}" ${pC_st()}/>` +
      `<circle cx="32" cy="32" r="7" fill="${k.b}"/>`;
  };

  // מודל למידת מכונה: מקרי עבר משני הסוגים, הגבול שנלמד ביניהם, ומקרה חדש שקיבל ציון
  D.g_ml = () => {
    const k = pC_K;
    return [[16, 15], [25.5, 14], [14.5, 27], [22, 22.5]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.2" fill="${k.n}"/>`).join('') +
      [[47.5, 31], [41, 42], [50, 43.5], [36.5, 50]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.2" fill="${k.w}" stroke="${k.n}" stroke-width="2"/>`).join('') +
      `<path d="M11 48C25.5 42.5 34 27 41 11" fill="none" ${pC_st(k.b)}/>` +
      `<circle cx="31" cy="30.5" r="6" fill="${k.m}" ${pC_st()}/>`;
  };
  Object.keys(D).forEach(k => { (k.indexOf('g_') === 0 ? G : A)[k] = D[k]; });
  }


  function art(h, lv) {
    const fn = A[h.art];
    return fn ? `<svg class="art" viewBox="0 0 520 270" aria-hidden="true" focusable="false">${fn(h, lv)}</svg>` : '';
  }
  function mini(h, lv) {

  }
  function glyph(k) {
    const fn = G[k];
    return fn ? `<svg class="glyph" viewBox="0 0 64 64" aria-hidden="true" focusable="false">${fn()}</svg>` : '';
  }
  return { art, mini, glyph, kinds: Object.keys(A), minis: Object.keys(B), glyphs: Object.keys(G) };
})();

   MAG.page(desc) מחזיר HTML של עמוד אחד. דף = 620x860.
   תוכנית העמודים נגזרת מהתעדוף (pri) של כל פעילות:
